        head +
        '<h1 class="auth-title">Confirm it is you</h1>' +
        '<p class="auth-sub">Step 3 of 3 · we sent a 6-digit code to ' + target + "</p>" +
        '<div class="steps-bar"><i class="on"></i><i class="on"></i><i class="on"></i></div>' +
        '<div class="otp" data-act="otpfocus">' + boxes + "</div>" +
        '<input id="otpInput" class="otp-hidden" inputmode="numeric" maxlength="6" autocomplete="one-time-code" />' +
        '<div class="otp-hint">Demo code · <b>' + A.code + "</b> · tap to fill</div>" +
        '<button class="btn btn-ghost btn-block" style="margin-bottom:10px" data-act="otpfill">Autofill the code</button>' +
        err +
        '<div class="seg" style="margin-bottom:14px">' +
          '<button class="seg-opt ' + (A.method === "email" ? "on" : "") + '" data-act="sendvia" data-m="email">Send by email</button>' +
          '<button class="seg-opt ' + (A.method === "phone" ? "on" : "") + '" data-act="sendvia" data-m="phone">Send by SMS</button>' +
        "</div>" +
        '<p class="auth-fine">A handover code from your welcome pack also works.</p>' +
      "</div>";
    }

    /* --- face id --- */
    if (A.step === "faceid") {
      return '<div class="authwrap center">' + head +
        '<div class="faceid-orb" id="faceOrb">' + faceIdSvg(96) + "</div>" +
        '<h1 class="auth-title">Set up Face ID</h1>' +
        '<p class="auth-sub">Open ONE Life without typing your password again. On Android this uses your fingerprint.</p>' +
        '<button class="btn btn-accent btn-block" data-act="facesetup">Enable Face ID</button>' +
        '<button class="auth-link" data-act="authfinish">Not now</button>' +
      "</div>";
    }
    return "";
  }

  function maskEmail(e) {
    if (!e || e.indexOf("@") < 0) return "your email";
    const [a, b] = e.split("@");
    return a.slice(0, 2) + "•••@" + b;
  }
  function maskPhone(p) {
    const d = String(p || "").replace(/\D/g, "");
    return d.length > 3 ? "•••• " + d.slice(-3) : "your number";
  }
  const sixDigits = () => String(Math.floor(100000 + Math.random() * 899999));

  /* the scanning animation, then through */
  function runFaceScan(next) {
    const orb = document.getElementById("faceOrb");
    if (orb) orb.classList.add("scanning");
    setTimeout(() => {
      if (orb) { orb.classList.remove("scanning"); orb.classList.add("ok"); }
      setTimeout(next, 620);
    }, 1250);
  }

  function otpCheck() {
    if (AUTH.typed.length < 6) return;
    if (AUTH.typed !== AUTH.code) {
      AUTH.err = "That code does not match. Try again.";
      AUTH.typed = "";
      authShow();
      return;
    }
    const d = AUTH.draft, acct = loadAccount() || {};
    Object.keys(d).forEach((k) => { if (k !== "pass") acct[k] = d[k]; });
    acct.verified = true;
    saveAccount(acct);
    toast("Verified · welcome to " + ME.community);
    authShow("faceid");
  }

  function authFinish() {
    const acct = loadAccount();
    if (acct && acct.first) {
      ME.name = acct.first;
      /* both partners, whatever name the account was created with */
      const f = acct.first.trim();
      ME.both = /mohammed/i.test(f) ? (/abdelrahman/i.test(f) ? f : "Abdelrahman and " + f)
                                    : f + " and Mohammed";
      ME.initials = (acct.first[0] + (acct.last ? acct.last[0] : "")).toUpperCase();
      if (acct.tower) ME.tower = acct.tower;
      if (RES.me) { RES.me.name = acct.first; RES.me.initials = ME.initials; RES.me.tower = ME.tower; }
    }
    authHide();
    render();
  }

  /* ---------------- language picker ---------------- */
  function langScreen() {
    return (
      '<div class="langwrap" id="langwrap">' +
        '<div class="lang-mark"><b>ONE</b><span>LIFE</span></div>' +
        '<h1 class="lang-title">' + T("chooseLang") + "</h1>" +
        '<p class="lang-sub">' + T("chooseLangSub") + "</p>" +
        '<div class="lang-grid">' + LANGS.map((l, i) =>
          '<button class="lang-opt ' + (S.lang === l.code ? "on" : "") + '" data-anim ' + stagger(i) +
            ' data-act="picklang" data-code="' + l.code + '"' + (l.rtl ? ' dir="rtl"' : "") + ">" +
            '<span class="lang-flag">' + l.flag + "</span>" +
            '<span class="lang-names"><b>' + l.name + "</b><i>" + l.sub + "</i></span>" +
            '<span class="lang-tick">' + ic("check") + "</span>" +
          "</button>").join("") + "</div>" +
        '<button class="btn btn-accent btn-block lang-go" data-act="langdone">' + T("continue") + "</button>" +
      "</div>"
    );
  }
  function showLangScreen() {
    document.getElementById("device").classList.add("gated");
    const wrap = document.getElementById("langLayer");
    wrap.innerHTML = langScreen();
    wrap.classList.add("on");
  }
  function hideLangScreen() {
    const wrap = document.getElementById("langLayer");
    wrap.classList.remove("on");
    /* the app stays hidden — the account flow takes over next */
    setTimeout(() => { wrap.innerHTML = ""; }, 500);
  }

  /* ---------------- tab bar + router ---------------- */
  const TABS = [
    { key: "home", label: "tHome", icon: "home", route: "home" },
    { key: "community", label: "tCommunity", icon: "users", route: "community" },
    { key: "pay", label: "tPay", icon: "tag", route: "pay" },
    { key: "ai", label: "tAI", icon: "ai", route: "ai" },
    { key: "profile", label: "tProfile", icon: "user", route: "profile" }
  ];
  const TAB_OF = {
    home: "home", notifications: "home", notifprefs: "home",
    community: "community", listing: "community", group: "community", question: "community", chat: "community",
    match: "match", ai: "ai",
    match: "community", matchdetail: "community", search: "home",
    pay: "pay",
    profile: "profile", privacy: "profile", about: "profile", mylistings: "profile", saved: "profile",
    mygroups: "profile", mymatches: "profile", support: "profile",
    services: "profile", amenity: "profile", visitor: "profile", pass: "profile", requests: "profile",
    amenities: "home", access: "home", facilities: "home", facility: "home", drone: "home",
    memory: "community", quiet: "community", freed: "home", building: "home", updates: "home", arrive: "home", ledger: "pay", myhome: "pay", podium: "home", logbook: "pay", motors: "community"
  };

  function drawTabs() {
    const active = TAB_OF[S.route] || "home";
    tabbar.innerHTML = TABS.map((t) =>
      '<button class="tabbtn ' + t.key + " " + (active === t.key ? "on" : "") + '" data-act="tabnav" data-route="' + t.route + '">' +
        ic(t.icon) + "<span>" + T(t.label) + "</span></button>").join("");
  }

  const composerSlot = document.getElementById("composerSlot");

  function composerFor() {
    if (S.route === "ai") {
      return '<div class="composer">' +
        '<input id="aiInput" placeholder="' + T("askPlaceholder") + '" autocomplete="off" enterkeyhint="send" />' +
        '<button class="send" data-act="aisend" aria-label="Send">' + ic("send") + "</button></div>";
    }
    if (S.route === "chat") {
      const p = r(S.params.id || "ahmed");
      return '<div class="composer">' +
        '<input id="chatInput" placeholder="Message ' + p.name + '" autocomplete="off" enterkeyhint="send" />' +
        '<button class="send" data-act="chatsend" data-id="' + (S.params.id || "ahmed") + '" aria-label="Send">' + ic("send") + "</button></div>";
    }
    return "";
  }

  function render() {
    const fn = SCREENS[S.route] || SCREENS.home;
    const focused = document.activeElement;
    const keep = focused && (focused.id === "aiInput" || focused.id === "chatInput") ? { id: focused.id, v: focused.value } : null;
    view.innerHTML = fn(S.params) + tourBar();
    const comp = composerFor();
    composerSlot.innerHTML = comp;
    document.getElementById("device").classList.toggle("has-composer", !!comp);
    translateTree(view);
    translateSlot();
    if (keep) {
      const el = document.getElementById(keep.id);
      if (el) { el.value = keep.v; el.focus(); }
    }
    drawTabs();
    translateTree(tabbar);
  }

  function translateSlot() {
    const sl = document.getElementById("composerSlot");
    if (sl) translateTree(sl);
  }

  function go(route, params, mode) {
    if (!SCREENS[route]) return;
    if (mode !== "back" && mode !== "tab") S.stack.push({ route: S.route, params: S.params });
    if (mode === "tab") S.stack = [];
    S.route = route;
    S.params = params || {};
    render();
    view.scrollTop = 0;
    if (route === "ai" && S.aiThread.length) scrollThread();
  }
  function back() {
    const prev = S.stack.pop();
    if (prev) { S.route = prev.route; S.params = prev.params; render(); view.scrollTop = 0; }
    else go("home", {}, "tab");
  }

  /* ---------------- events ---------------- */
  document.addEventListener("click", function (e) {
    const t = e.target.closest("[data-act]");
    if (!t) return;
    const act = t.dataset.act;

    switch (act) {
      case "tabnav": {
        closeSheet();
        go(t.dataset.route, {}, "tab");
        break;
      }
      case "go": {
        closeSheet();
        go(t.dataset.route, { id: t.dataset.id }, "push");
        break;
      }
      case "back": back(); break;

      case "comtab": {
        S.comTab = t.dataset.tab;
        S.route = "community";
        render();
        view.scrollTop = 0;
        break;
      }
      case "filter": {
        S.filter = t.dataset.key;
        render();
        break;
      }
      case "mcat": { S.mcat = t.dataset.key; render(); break; }
      case "myint": {
        const k = t.dataset.key;
        if (S.myInterests.has(k)) S.myInterests.delete(k); else S.myInterests.add(k);
        t.classList.toggle("on", S.myInterests.has(k));
        break;
      }
      case "amenpick": { S.amenityPick = t.dataset.id; S.amenitySlot = null; render(); break; }
      case "amenday":  { S.amenityDay = t.dataset.key; S.amenitySlot = null; render(); break; }
      case "amenslot": { S.amenitySlot = t.dataset.key; render(); break; }
      case "bookamenity": {
        const am = AMENITIES.find((x) => x.id === S.amenityPick);
        const b = { id: uid("b"), name: am.name, day: S.amenityDay, slot: S.amenitySlot };
        S.bookings.unshift(b);
        S.amenitySlot = null;
        go("requests", {}, "push");
        toast("Booked · " + b.name + " " + b.day, () => { S.bookings = S.bookings.filter((x) => x.id !== b.id); render(); });
        break;
      }
      case "cancelbooking": {
        const id = t.dataset.id;
        const b = S.bookings.find((x) => x.id === id);
        confirmThen("Cancel this booking?", b ? b.name + " · " + b.day + " " + b.slot : "", "Cancel booking", () => {
          S.bookings = S.bookings.filter((x) => x.id !== id); render();
          toast("Booking cancelled", () => { S.bookings.unshift(b); render(); });
        });
        break;
      }
      case "cancelreq": {
        const id = t.dataset.id;
        const q = S.requests.find((x) => x.id === id);
        confirmThen("Cancel this request?", "The technician will be told it is no longer needed.", "Cancel request", () => {
          S.requests = S.requests.filter((x) => x.id !== id); render();
          toast("Request cancelled", () => { S.requests.unshift(q); render(); });
        });
        break;
      }
      case "cancelpass": {
        const id = t.dataset.id;
        const p = S.passes.find((x) => x.id === id);
        confirmThen("Revoke this pass?", p ? "The gate code for " + p.name + " stops working immediately." : "", "Revoke pass", () => {
          S.passes = S.passes.filter((x) => x.id !== id);
          back();
          toast("Pass revoked", () => { S.passes.unshift(p); render(); });
        });
        break;
      }
      case "pickphoto": {
        const inp = document.getElementById(t.dataset.for);
        if (inp) inp.click();
        break;
      }
      case "picklang": {
        applyLang(t.dataset.code);
        showLangScreen();
        break;
      }
      case "langdone": {
        render();
        afterLang();
        setTimeout(hideLangScreen, 60);
        break;
      }
      case "memcat": { S.memCat = t.dataset.key; render(); break; }
      case "arrivestart": {
        S.arriving = true; render();
        toast("Gate opening · lift called");
        setTimeout(() => { if (S.arriving) toast("Home cooling to 22°"); }, 2400);
        break;
      }
      case "arrivestop": { S.arriving = false; render(); break; }
      case "carfilter": { S.carFilter = t.dataset.key; render(); break; }
      case "carview": {
        const id = t.dataset.id, c = CARS.find((x) => x.id === id);
        if (S.carView.has(id)) break;
        S.carView.add(id); render();
        toast(c ? (c.mode === "rent" ? "Booked · keys at the concierge" : "Viewing arranged · " + c.bay) : "Done",
          () => { S.carView.delete(id); render(); });
        break;
      }
      case "sharelog": {
        if (S.logShared) break;
        S.logShared = true; render();
        toast("Logbook attached · buyers see it", () => { S.logShared = false; render(); });
        break;
      }
      case "shoporder": {
        const id = t.dataset.id, sh = SHOPS.find((x) => x.id === id);
        if (S.shopOrder.has(id)) break;
        S.shopOrder.add(id); render();
        toast("Ordered from " + (sh ? sh.name : "the podium"), () => { S.shopOrder.delete(id); render(); });
        break;
      }
      case "wantvote": {
        const k = t.dataset.key;
        if (S.wantVote.has(k)) break;
        S.wantVote.add(k); render();
        toast("Counted · leasing sees this", () => { S.wantVote.delete(k); render(); });
        break;
      }
      case "listhome": {
        if (S.listedHome) break;
        confirmThen("Quietly test the market?",
          "47 verified people are told a home like yours may become available. Your name, your unit and your photos stay private until you choose someone.",
          "Tell the 47", () => {
            S.listedHome = true; render();
            toast("Quietly listed · nothing is public", () => { S.listedHome = false; render(); });
            setTimeout(() => { if (S.listedHome) toast("3 people have asked to view"); }, 3200);
          });
        break;
      }
      case "paybill": {
        const id = t.dataset.id, b = BILLS.find((x) => x.id === id);
        S.paid.add(id); render();
        toast("Paid · AED " + (b ? b.amount : ""), () => { S.paid.delete(id); render(); });
        break;
      }
      case "payall": {
        const open = BILLS.filter((x) => x.status !== "paid" && !S.paid.has(x.id));
        confirmThen("Pay everything?",
          open.length + " bills, AED " + open.reduce((a2, x) => a2 + parseFloat(x.amount.replace(/,/g, "")), 0).toLocaleString() +
          " in total. Nothing is actually charged in this demo.", "Pay now", () => {
            open.forEach((x) => S.paid.add(x.id));
            render();
            toast("All paid · receipts sent", () => { open.forEach((x) => S.paid.delete(x.id)); render(); });
          });
        break;
      }
      case "devint": {
        const id = t.dataset.id, d = DEVS.find((x) => x.id === id);
        if (S.devInterest.has(id)) break;
        S.devInterest.add(id); render();
        toast(d && d.accent ? "Registered · you get first look" : "You will be told when it opens",
          () => { S.devInterest.delete(id); render(); });
        break;
      }
      case "savedev": {
        const id = t.dataset.id;
        if (S.savedDev.has(id)) { S.savedDev.delete(id); toast("Removed"); }
        else { S.savedDev.add(id); toast("Saved"); }
        render();
        break;
      }
      case "bzone": {
        const z = ZONES.find((x) => x.id === t.dataset.id);
        if (!z) break;
        const l = LIVE[z.live], p = pct(z.live);
        S.confirmData = {
          title: z.emo + "  " + z.name,
          body: l.now + " of " + l.cap + " in use right now, so it is " + lampFor(z.live) +
                ". " + z.floor + ". Quietest " + l.quiet.toLowerCase() + ".",
          yes: "Open with my phone",
          run: () => go("access", {}, "push")
        };
        openSheet("confirm");
        break;
      }
      case "vouch": {
        const id = t.dataset.id, k = MEMORY.find((x) => x.id === id);
        if (S.vouched.has(id)) break;
        S.vouched.add(id); if (k) k.vouches += 1;
        render();
        toast("Vouched · the building remembers", () => { S.vouched.delete(id); if (k) k.vouches -= 1; render(); });
        break;
      }
      case "saveknow": {
        const id = t.dataset.id;
        if (S.savedKnow.has(id)) { S.savedKnow.delete(id); toast("Removed"); }
        else { S.savedKnow.add(id); toast("Saved to your profile"); }
        render();
        break;
      }
      case "quiet": {
        const id = t.dataset.id;
        S.quietIntro.add(id);
        render();
        if (id === "p2") setTimeout(() => toast("Khalid marked you too"), 900);
        else toast("Marked · they are not told");
        break;
      }
      case "release": { releaseBooking(t.dataset.id); break; }
      case "makepass": makePass(); break;
      case "unlock": {
        const b = t;
        b.classList.add("is-done");
        b.innerHTML = ic("check") + "Door open · welcome in";
        LIVE.gym.now = Math.min(LIVE.gym.cap, LIVE.gym.now + 1);
        toast("Gym unlocked · you are checked in", () => { LIVE.gym.now = Math.max(0, LIVE.gym.now - 1); render(); });
        break;
      }
      case "dronenext": {
        S.droneStage = Math.min(3, (S.droneStage || 0) + 1);
        render();
        if (S.droneStage === 3) toast("Drone landed · locker 12");
        break;
      }
      case "concierge": {
        confirmThen("Request " + t.dataset.name + "?", "The concierge team confirms availability and comes back to you in the app, usually within the hour.",
          "Send request", () => { toast("Request sent to concierge"); });
        break;
      }
      case "langopen": showLangScreen(); break;

      /* ---- account flow ---- */
      case "authstep": { authShow(t.dataset.step); break; }
      case "authmethod": { AUTH.method = t.dataset.m; authShow(); break; }
      case "picktower": { AUTH.draft.tower = t.dataset.t; authShow(); break; }
      case "picktype": { AUTH.draft.rtype = t.dataset.t; authShow(); break; }
      case "authskip": { authHide(); render(); break; }
      case "dosignin": {
        const id = document.getElementById(AUTH.method === "phone" ? "aPhone" : "aEmail");
        const pw = document.getElementById("aPass");
        if (!id || !id.value.trim()) { AUTH.err = "Enter your " + (AUTH.method === "phone" ? "number" : "email") + "."; authShow(); break; }
        if (!pw || pw.value.length < 4) { AUTH.err = "Enter your password."; authShow(); break; }
        const acct = loadAccount() || {};
        acct.first = acct.first || ME.name;
        if (AUTH.method === "phone") acct.phone = id.value; else acct.email = id.value;
        saveAccount(acct);
        AUTH.draft = acct;
        AUTH.code = sixDigits(); AUTH.typed = "";
        authShow("verify");
        break;
      }
      case "dosignup": {
        const g = (i) => { const e = document.getElementById(i); return e ? e.value.trim() : ""; };
        const d = AUTH.draft;
        d.first = g("sFirst"); d.last = g("sLast");
        d.email = g("sEmail"); d.phone = g("sPhone"); d.pass = g("sPass");
        if (!d.first) { AUTH.err = "Please enter your first name."; authShow(); break; }
        if (!d.email || d.email.indexOf("@") < 1) { AUTH.err = "That email does not look right."; authShow(); break; }
        if (!d.phone || d.phone.replace(/\D/g, "").length < 7) { AUTH.err = "Please enter a mobile number."; authShow(); break; }
        if (d.pass.length < 8) { AUTH.err = "Use at least 8 characters for your password."; authShow(); break; }
        authShow("residence");
        break;
      }
      case "doresidence": {
        const d = AUTH.draft;
        const fl = document.getElementById("rFloor"), un = document.getElementById("rUnit");
        d.tower = d.tower || "Tower B";
        d.rtype = d.rtype || "Owner";
        d.floor = fl ? fl.value.trim() : ""; d.unit = un ? un.value.trim() : "";
        if (!d.floor) { AUTH.err = "Which floor are you on?"; authShow(); break; }
        if (!d.unit) { AUTH.err = "Please add your apartment number."; authShow(); break; }
        AUTH.code = sixDigits(); AUTH.typed = "";
        authShow("verify");
        break;
      }
      case "sendvia": {
        AUTH.method = t.dataset.m;
        AUTH.code = sixDigits(); AUTH.typed = "";
        authShow();
        toast(AUTH.method === "phone" ? "Code sent by SMS" : "Code sent by email");
        break;
      }
      case "otpfocus": { const e = document.getElementById("otpInput"); if (e) e.focus(); break; }
      case "otpfill": {
        AUTH.typed = AUTH.code;
        authShow();
        setTimeout(otpCheck, 300);
        break;
      }
      case "facesetup": {
        runFaceScan(() => {
          const d = AUTH.draft, acct = loadAccount() || {};
          Object.keys(d).forEach((k) => { if (k !== "pass") acct[k] = d[k]; });
          acct.face = true;
          saveAccount(acct);
          authFinish();
        });
        break;
      }
      case "facescan": {
        runFaceScan(() => { authFinish(); });
        break;
      }
      case "authfinish": authFinish(); break;
      case "signout": {
        confirmThen("Sign out?", "You will need Face ID or your password to get back in.", "Sign out", () => {
          const acct = loadAccount() || {};
          AUTH.draft = acct;
          authShow(acct.face ? "faceunlock" : "signin");
        });
        break;
      }
      case "tourstart": tourGo(0); break;
      case "tournext": tourGo(S.tour.step + 1); break;
      case "tourend": { S.tour.on = false; render(); break; }
      case "reset": {
        confirmThen("Reset the demo?", "Everything you joined, saved, listed or booked goes back to the opening state. Useful between presentations.", "Reset demo", resetDemo);
        break;
      }
      case "dosearch": {
        const el = document.getElementById("qInput");
        S.query = el ? el.value : "";
        render();
        const again = document.getElementById("qInput");
        if (again) { again.focus(); again.setSelectionRange(again.value.length, again.value.length); }
        break;
      }
      case "pick": {
        t.parentElement.querySelectorAll(".pick").forEach((x) => x.classList.remove("on"));
        t.classList.add("on");
        break;
      }
      case "join": {
        const id = t.dataset.id;
        if (S.joined.has(id)) { S.joined.delete(id); render(); toast("Left activity", () => { S.joined.add(id); render(); }); }
        else {
          S.joined.add(id); render();
          const m = MATCHES.find((x) => x.id === id);
          toast(m ? "Joined · " + m.title : "Joined", () => { S.joined.delete(id); render(); });
        }
        break;
      }
      case "cancelspot": {
        const id = t.dataset.id;
        const m = MATCHES.find((x) => x.id === id);
        confirmThen("Cancel your spot?", m ? m.title + " · " + m.when + ". The other residents are told a place opened up." : "",
          "Cancel my spot", () => {
            S.joined.delete(id); render();
            toast("Spot cancelled", () => { S.joined.add(id); render(); });
          });
        break;
      }
      case "confirmyes": {
        const c = S.confirmData;
        closeSheet();
        if (c && typeof c.run === "function") c.run();
        break;
      }
      case "closesheet": closeSheet(); break;
      case "undo": {
        const u = S.undo;
        S.undo = null;
        hideToast();
        if (u && typeof u.run === "function") u.run();
        break;
      }
      case "joingroup": {
        const id = t.dataset.id;
        if (S.groups.has(id)) { S.groups.delete(id); toast("Left group"); }
        else { S.groups.add(id); toast("Joined group"); }
        render();
        break;
      }
      case "save": {
        const id = t.dataset.id;
        if (S.saved.has(id)) { S.saved.delete(id); toast("Removed from saved"); }
        else { S.saved.add(id); toast("Saved"); }
        render();
        break;
      }
      case "helpful": {
        const id = t.dataset.id;
        if (!S.helpful.has(id)) { S.helpful.add(id); toast("Marked helpful"); render(); }
        break;
      }
      case "connect": {
        S.connected.add(t.dataset.id);
        toast("Request sent · they choose to accept");
        render();
        break;
      }
      case "tog": {
        const k = t.dataset.key;
        S.prefs[k] = !S.prefs[k];
        const knob = t.querySelector(".tog");
        if (knob) knob.classList.toggle("on", S.prefs[k]);
        break;
      }
      case "sheet": openSheet(t.dataset.sheet); break;
      case "publish": {
        const kind = t.dataset.kind;
        closeSheet();
        if (kind === "listing") createListing();
        else if (kind === "activity") createActivity();
        else if (kind === "ask") createQuestion();
        else if (kind === "maintenance") createRequest();
        else if (kind === "interests") { render(); toast("Interests updated"); }
        else if (kind === "car") {
          CARS.unshift({ id: uid("c"), emo:"🚗", name:"Your car", yr:"2024", km:"0", price:"—",
            seller:"me", bay:"B2 · your bay", why:"Listed just now. Only verified residents can see it.",
            logs:0 });
          go("motors", {}, "push");
          toast("Listed · neighbours can see it", () => { CARS.shift(); render(); });
        }
        else if (kind === "log") {
          LOG.unshift({ y:new Date().getFullYear(), m:"This month", emo:"⭐", t:"Your record",
            by:"Added by you · awaiting building verification",
            note:"The building confirms the job with the contractor, then it is locked into the record.",
            tag:"Pending verification" });
          go("logbook", {}, "push");
          toast("Added · the building will verify it", () => { LOG.shift(); render(); });
        }
        else if (kind === "know") {
          MEMORY.unshift({ id: uid("k"), cat: "Home", emo: "⭐", title: "Your recommendation",
            what: "Added by you just now", note: "Neighbours can vouch for this, and it stays in the building after you leave.",
            vouches: 1, since: new Date().getFullYear(), last: "added just now", by: ["me"] });
          go("memory", {}, "push");
          toast("Added · the building remembers this now", () => { MEMORY.shift(); render(); });
        }
        else toast(t.dataset.msg || "Published");
        break;
      }
      case "toastonly": toast(t.dataset.msg || "Done"); break;
      case "refresh": {
        render();
        toast("Feed updated");
        break;
      }
      case "aisay": {
        aiAsk(t.dataset.text);
        break;
      }
      case "aisend": {
        const inp = document.getElementById("aiInput");
        if (inp && inp.value.trim()) { const v = inp.value; inp.value = ""; aiAsk(v); }
        break;
      }
      case "chatsend": {
        const who = t.dataset.id;
        const inp = document.getElementById("chatInput");
        if (!inp || !inp.value.trim()) break;
        S.chat[who].push({ me: true, t: inp.value });
        inp.value = "";
        render();
        scrollThread();
        setTimeout(() => {
          S.chat[who].push({ me: false, t: "Perfect. I am around this evening, I will meet you in the lobby." });
          if (S.route === "chat") { render(); scrollThread(); }
        }, 1400);
        break;
      }
    }
  });

  /* photos chosen from the camera roll show up as real thumbnails */
  document.addEventListener("change", function (e) {
    const inp = e.target;
    if (!inp || inp.type !== "file" || !inp.files || !inp.files.length) return;
    const drop = document.getElementById(inp.id === "lPhoto" ? "lDrop" : "mDrop");
    const files = Array.prototype.slice.call(inp.files, 0, 4);
    let loaded = 0;
    S.photos = [];
    files.forEach(function (f, i) {
      const rd = new FileReader();
      rd.onload = function () {
        S.photos[i] = rd.result;
        if (++loaded === files.length && drop) {
          drop.classList.add("has");
          drop.innerHTML = '<div class="up-thumbs">' +
            S.photos.map(function (src) { return '<img src="' + src + '" alt="" />'; }).join("") +
            '<span class="up-more">' + ic("plus") + "</span></div>" +
            '<span class="up-label">' + S.photos.length + (S.photos.length === 1 ? " photo added" : " photos added") + "</span>";
          toast(S.photos.length === 1 ? "Photo added" : S.photos.length + " photos added");
        }
      };
      rd.readAsDataURL(f);
    });
  });

  document.addEventListener("input", function (e) {
    if (e.target && e.target.id === "otpInput") {
      AUTH.typed = e.target.value.replace(/\D/g, "").slice(0, 6);
      const boxes = document.querySelectorAll(".otp-box");
      boxes.forEach((b, i) => {
        b.textContent = AUTH.typed[i] || "";
        b.classList.toggle("full", !!AUTH.typed[i]);
        b.classList.toggle("cur", AUTH.typed.length === i);
      });
      if (AUTH.typed.length === 6) setTimeout(otpCheck, 220);
      return;
    }
    if (e.target && e.target.id === "qInput") {
      S.query = e.target.value;
      const scroll = view.scrollTop;
      render();
      const el = document.getElementById("qInput");
      if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
      view.scrollTop = scroll;
    }
  });

  document.addEventListener("keydown", function (e) {
    if (e.key !== "Enter") return;
    if (e.target.id === "aiInput") { const v = e.target.value; e.target.value = ""; aiAsk(v); }
    if (e.target.id === "chatInput") { document.querySelector('[data-act="chatsend"]').click(); }
  });

  /* collapse the greeting into the slim bar as the feed scrolls */
  view.addEventListener("scroll", function () {
    const mini = document.getElementById("minibar");
    const big = document.getElementById("bigbar");
    if (!mini || !big) return;
    const past = view.scrollTop > 46;
    mini.classList.toggle("on", past);
    big.classList.toggle("gone", past);
  }, { passive: true });

  /* occupancy drifts gently, so the numbers are visibly live during a demo */
  setInterval(function () {
    Object.keys(LIVE).forEach(function (k) {
      const l = LIVE[k];
      if (Math.random() < 0.55) return;
      l.now = Math.max(0, Math.min(l.cap, l.now + (Math.random() < 0.5 ? -1 : 1)));
    });
    if (S.route === "amenities" || S.route === "facilities" || S.route === "facility") {
      const y = view.scrollTop; render(); view.scrollTop = y;
    }
  }, 5000);

  /* turn the building with a finger */
  (function () {
    let dragging = false, startX = 0, startRot = 0, moved = 0;
    function down(e) {
      const w = e.target.closest && e.target.closest("#bworld");
      if (!w) return;
      dragging = true; moved = 0;
      startX = (e.touches ? e.touches[0].clientX : e.clientX);
      startRot = S.bRot || 0;
    }
    function move(e) {
      if (!dragging) return;
      const x = (e.touches ? e.touches[0].clientX : e.clientX);
      const dx = x - startX;
      moved = Math.abs(dx);
      S.bRot = startRot + dx * 0.42;
      const st = document.querySelector(".bstage");
      if (st) st.style.transform = "rotateX(6deg) rotateZ(" + S.bRot + "deg)";
      if (moved > 6 && e.cancelable) e.preventDefault();
    }
    function up() { dragging = false; }
    document.addEventListener("mousedown", down);
    document.addEventListener("mousemove", move);
    document.addEventListener("mouseup", up);
    document.addEventListener("touchstart", down, { passive: true });
    document.addEventListener("touchmove", move, { passive: false });
    document.addEventListener("touchend", up);
  })();

  scrim.addEventListener("click", closeSheet);

  /* ---------------- boot ---------------- */
  document.getElementById("device").classList.add("gated");
  render();
  const splash = document.getElementById("splash");
  function dismiss() {
    splash.classList.add("out");
    setTimeout(() => splash.remove(), 800);
  }
  function afterSplash() {
    showLangScreen();
    dismiss();
  }
  /* after the language is chosen we go to the account flow */
  function afterLang() {
    const acct = loadAccount();
    if (acct && acct.face) { AUTH.draft = acct; authShow("faceunlock"); }
    else if (acct && acct.verified) { AUTH.draft = acct; authShow("signin"); }
    else authShow("welcome");
  }
  setTimeout(afterSplash, 3200);
  splash.addEventListener("click", afterSplash);
})();

</script>
</body>
</html>
