<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, interactive-widget=resizes-content" />
<meta name="theme-color" content="#0D0B14" />

<!-- home screen icon (iPhone: Share > Add to Home Screen) -->
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-180.png" />
<link rel="manifest" href="manifest.json" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="ONE Life" />
<meta name="mobile-web-app-capable" content="yes" />

<!-- link preview on WhatsApp / email / LinkedIn -->
<meta property="og:type" content="website" />
<meta property="og:title" content="ONE Life" />
<meta property="og:description" content="Your community. Connected. A private, verified resident network." />
<meta property="og:image" content="og-image.png" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:image" content="og-image.png" />
<title>ONE Life — Your community. Connected.</title>
<meta name="description" content="ONE Life — a private, verified resident network for premium residential communities." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500&family=Jost:wght@200;300;400;500&family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ============================================================
   ONE Life — visual system
   Palette : ONE brand purple #9E69FF / white / deep aubergine ink
   Type    : Jost (brand + display) · Manrope (UI) · Plex Mono (data)
   Signature: concentric "ONE" rings = resident ↔ community ↔ management
   ============================================================ */

:root{
  /* ONE Residence — night. Ink aubergine, ONE violet, and the warm
     gold that runs along the balcony edges of the real tower. */
  --brand:      #8F66F4;
  --brand-deep: #6B45C8;
  --brand-soft: rgba(143,102,244,.14);
  --brand-line: rgba(143,102,244,.34);
  --gold:       #E8C489;   /* balcony light */
  --gold-soft:  rgba(232,196,137,.12);
  --gold-line:  rgba(232,196,137,.30);
  --ai:         #B79BFF;
  --ai-soft:    rgba(183,155,255,.12);

  --ink:        #0D0B14;
  --ink-2:      #121019;
  --surface:    #1A1725;
  --surface-2:  #221E30;
  --line:       rgba(255,255,255,.075);
  --line-2:     rgba(255,255,255,.16);
  --white:      #F3F0F7;
  --grey:       #9C96AC;
  --grey-2:     #6E6880;
  --green:      #6FCF97;

  --r-lg: 6px;
  --r-md: 5px;
  --r-sm: 3px;

  --pad: 22px;
  --ease: cubic-bezier(.22,.85,.3,1);
  --font-brand: "Bodoni Moda", Georgia, serif;
  --font-ui: "Manrope", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-display: "Bodoni Moda", Georgia, serif;
  --font-mono: "IBM Plex Mono", ui-monospace, monospace;
}

*{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }

html,body{ height:100%; }
body{
  background:#E7E2DA;
  color:var(--white);
  font-family:var(--font-ui);
  font-size:15px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}
button{ font:inherit; color:inherit; background:none; border:0; cursor:pointer; }
input,textarea,select{ font:inherit; color:inherit; }
img{ display:block; max-width:100%; }

/* ---------- ambience (desktop only) ---------- */
.ambience{ position:fixed; inset:0; overflow:hidden; pointer-events:none; }
.orb{ position:absolute; border-radius:50%; filter:blur(90px); opacity:.5; }
.orb-a{ display:none; }
.orb-b{ display:none; }

/* ---------- device shell ---------- */
.stage{ position:relative; display:flex; flex-direction:column; align-items:center; gap:14px; }
.device{
  position:relative;
  width:400px; height:min(844px, 92vh);
  background:var(--ink-2);
  border:1px solid rgba(28,26,24,.14);
  border-radius:46px;
  overflow:hidden;
  display:flex; flex-direction:column;
  box-shadow:0 40px 100px -30px rgba(40,32,24,.35), 0 0 0 10px rgba(28,26,24,.03);
}
.stage-note{ font-family:var(--font-mono); font-size:10.5px; letter-spacing:.16em; text-transform:uppercase; color:var(--grey-2); }

/* ---------- splash : the ONE rings ---------- */
.splash{
  position:absolute; inset:0; z-index:60;
  background:radial-gradient(125% 95% at 50% 32%, #2E2352 0%, #1A1530 52%, #0C0A14 100%);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  transition:opacity .7s var(--ease), transform .7s var(--ease);
}
.splash.out{ opacity:0; transform:scale(1.04); pointer-events:none; }
.splash-inner{ position:relative; display:grid; place-items:center; }

.rings{
  position:absolute; width:300px; height:300px; opacity:.5; pointer-events:none;
  animation:rise 1.2s var(--ease) both;
}
.ring{ fill:none; stroke:rgba(232,196,137,.55); stroke-width:1; transform-origin:110px 110px; }
.ring.r1{ stroke-dasharray:120 495; animation:spin 5.5s linear infinite; }
.ring.r2{ stroke:rgba(143,102,244,.75); stroke-dasharray:80 385; animation:spin 4s linear infinite reverse; }
.ring.r3{ stroke-dasharray:60 254; animation:spin 3s linear infinite; }
.core{ fill:var(--gold); animation:pulse 2.4s var(--ease) infinite; }
@keyframes spin{ to{ transform:rotate(360deg) } }
@keyframes pulse{ 0%,100%{ opacity:.4; r:4 } 50%{ opacity:1; r:6.5 } }

.wordmark{
  position:relative; text-align:right; color:#fff;
  opacity:0; animation:rise 1s var(--ease) .35s forwards;
}
.wm-one{
  display:block; font-family:var(--font-brand); font-weight:400;
  font-size:74px; line-height:.84; letter-spacing:.045em; margin-right:-.045em;
}
.wm-life{
  display:block; font-family:var(--font-display); font-weight:200;
  font-size:18px; letter-spacing:.46em; margin-right:-.46em; margin-top:10px; color:var(--gold);
}
.splash-tag{ margin-top:30px; color:rgba(255,255,255,.86); font-size:13px; opacity:0; animation:rise .9s var(--ease) .8s forwards; }
.splash-bar{ margin-top:30px; width:120px; height:1px; background:rgba(255,255,255,.22); overflow:hidden; opacity:0; animation:rise .5s var(--ease) 1.05s forwards; }
.splash-bar i{ display:block; height:100%; width:0; background:var(--gold); animation:load 1.5s var(--ease) 1.15s forwards; }
@keyframes load{ to{ width:100% } }
.splash-foot{
  position:absolute; bottom:36px; font-family:var(--font-mono); font-size:9.5px;
  letter-spacing:.2em; text-transform:uppercase; color:rgba(255,255,255,.5);
  opacity:0; animation:rise .9s var(--ease) 1.45s forwards;
}
@keyframes rise{ from{ opacity:0; transform:translateY(10px) } to{ opacity:1; transform:none } }

/* the same lockup, small, for in-app brand moments */
.mark{ text-align:right; display:inline-block; color:var(--white); }
.mark b{ display:block; font-family:var(--font-brand); font-weight:400; font-size:34px; line-height:.85; letter-spacing:.045em; margin-right:-.045em; }
.mark span{ display:block; font-family:var(--font-display); font-weight:200; font-size:9px; letter-spacing:.44em; margin-right:-.44em; margin-top:5px; }

/* ---------- scrolling view ---------- */
.view{
  flex:1; overflow-y:auto; overflow-x:hidden;
  scrollbar-width:none; outline:none;
  padding-bottom:104px;
}
.device.has-composer .view{ padding-bottom:16px; }
.view::-webkit-scrollbar{ display:none; }
.page{ animation:pageIn .42s var(--ease) both; }
.page.push{ animation:pushIn .38s var(--ease) both; }
@keyframes pageIn{ from{ opacity:0; transform:translateY(12px) } to{ opacity:1; transform:none } }
@keyframes pushIn{ from{ opacity:0; transform:translateX(26px) } to{ opacity:1; transform:none } }

/* ---------- top bars ---------- */
.topbar{
  position:static; z-index:20;
  padding:calc(env(safe-area-inset-top) + 20px) var(--pad) 12px;
  background:linear-gradient(to bottom, var(--ink-2) 62%, rgba(11,14,21,0));
  display:flex; align-items:flex-end; justify-content:space-between; gap:12px;
}
.topbar.solid{ background:var(--ink-2); border-bottom:1px solid var(--line); padding-bottom:14px; }
.eyebrow{
  font-family:var(--font-mono); font-size:9.5px; letter-spacing:.22em;
  text-transform:uppercase; color:var(--grey-2);
}
.greeting{ font-family:var(--font-display); font-weight:400; font-size:29px; letter-spacing:-.015em; margin-top:7px; line-height:1.12; }
.greeting b{ font-weight:400; color:var(--white); }
.page-title{ font-family:var(--font-display); font-weight:400; font-size:32px; letter-spacing:-.015em; margin-top:8px; line-height:1.1; }
.page-sub{ color:var(--grey); font-size:13px; margin-top:6px; }

.icon-btn{
  width:38px; height:38px; flex:0 0 38px; border-radius:50%;
  border:1px solid var(--line); background:var(--surface);
  display:grid; place-items:center; position:relative;
  transition:transform .18s var(--ease), border-color .2s;
}
.icon-btn:active{ transform:scale(.92); }
.icon-btn svg{ width:17px; height:17px; }
.icon-btn .dot{ position:absolute; top:8px; right:9px; width:6px; height:6px; border-radius:50%; background:var(--brand); box-shadow:0 0 0 3px var(--surface); }
.bar-actions{ display:flex; gap:8px; align-items:center; }

/* ---------- generic layout ---------- */
.section{ padding:6px var(--pad) 0; }
.section + .section{ margin-top:22px; }
.section-head{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:11px; }
.section-head h2{ font-size:12px; font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:var(--grey); }
.link{ font-size:12px; color:var(--brand); letter-spacing:.02em; }
.stack{ display:flex; flex-direction:column; gap:11px; }

/* staggered entrance */
[data-anim]{ animation:cardIn .5s var(--ease) both; }
@keyframes cardIn{ from{ opacity:0; transform:translateY(14px) } to{ opacity:1; transform:none } }

/* ---------- signals (live status strip) ---------- */
.signals{ display:flex; gap:9px; overflow-x:auto; padding:2px var(--pad) 4px; scrollbar-width:none; }
.signals::-webkit-scrollbar{ display:none; }
.signal{
  flex:0 0 152px; padding:13px 14px 14px; border-radius:var(--r-md);
  background:var(--surface); border:1px solid var(--line);
  display:flex; flex-direction:column; gap:5px; text-align:left;
  transition:transform .2s var(--ease), border-color .2s;
}
.signal:active{ transform:scale(.97); }
.signal .sig-top{ display:flex; align-items:center; gap:7px; color:var(--grey-2); }
.signal .sig-top svg{ width:14px; height:14px; }
.signal .sig-label{ font-family:var(--font-mono); font-size:9px; letter-spacing:.16em; text-transform:uppercase; }
.signal .sig-value{ font-size:13.5px; font-weight:600; letter-spacing:-.01em; }
.signal .sig-note{ font-size:11.5px; color:var(--grey); }
.signal.is-live{ border-color:var(--brand-line); background:linear-gradient(160deg,var(--brand-soft),var(--surface) 60%); }
.signal.is-live .sig-top{ color:var(--brand); }

.live-dot{ width:5px; height:5px; border-radius:50%; background:var(--green); display:inline-block; animation:blink 2s ease-in-out infinite; }
@keyframes blink{ 0%,100%{ opacity:1 } 50%{ opacity:.25 } }

/* ---------- cards ---------- */
.card{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg);
  padding:20px 18px; position:relative; overflow:hidden;
  box-shadow:0 1px 0 rgba(28,26,24,.04);
}
.card.tap{ transition:transform .2s var(--ease), background .2s; }
.card.tap:active{ transform:scale(.995); background:var(--surface-2); }
.card-eyebrow{
  display:flex; align-items:center; gap:7px; margin-bottom:9px;
  font-family:var(--font-mono); font-size:9.5px; letter-spacing:.2em;
  text-transform:uppercase; color:var(--grey-2);
}
.card-eyebrow .tick{ width:14px; height:1px; background:var(--brand); }
.card-title{ font-family:var(--font-display); font-weight:400; font-size:22px; letter-spacing:-.005em; line-height:1.18; }
.card-title.sm{ font-size:17px; }
.card-body{ color:var(--grey); font-size:13.5px; margin-top:7px; }
.card-actions{ display:flex; gap:8px; margin-top:14px; align-items:center; }

.meta-row{ display:flex; flex-wrap:wrap; gap:6px; margin-top:12px; }
.chip{
  font-family:var(--font-mono); font-size:9.5px; letter-spacing:.12em; text-transform:uppercase;
  padding:5px 9px; border-radius:2px; border:1px solid var(--line);
  color:var(--grey); background:transparent;
}
.chip.accent{ color:var(--brand); border-color:var(--brand-line); background:var(--brand-soft); }

/* people row */
.people{ display:flex; align-items:center; gap:10px; margin-top:13px; }
.avatars{ display:flex; }
.avatars .av{ margin-left:-8px; border:2px solid var(--surface); }
.avatars .av:first-child{ margin-left:0; }
.av{
  width:30px; height:30px; border-radius:50%; flex:0 0 auto;
  display:grid; place-items:center; font-size:11px; font-weight:700; letter-spacing:.02em;
  color:#F4F1EC; background:#1C1A18;
}
.av.lg{ width:56px; height:56px; font-size:18px; }
.av.md{ width:38px; height:38px; font-size:13px; }
.av.v2{ background:#6B4BD6; }
.av.v3{ background:#8A7F72; }
.av.v4{ background:#4A32A8; }
.people-txt{ font-size:12.5px; color:var(--grey); }

.verified{ display:inline-flex; align-items:center; gap:4px; color:var(--brand); font-size:11.5px; white-space:nowrap; }
.verified svg{ width:12px; height:12px; }

/* ---------- buttons ---------- */
.btn{
  height:40px; padding:0 18px; border-radius:2px;
  border:1px solid var(--line-2); background:rgba(255,255,255,.04);
  font-size:13px; font-weight:600; letter-spacing:.01em;
  display:inline-flex; align-items:center; justify-content:center; gap:7px;
  transition:transform .16s var(--ease), background .2s, border-color .2s, color .2s;
}
.btn:active{ transform:scale(.95); }
.btn svg{ width:14px; height:14px; }
.btn-accent{ background:#1C1A18; border-color:#1C1A18; color:#F4F1EC; }
.btn-ghost{ background:transparent; border-color:var(--line-2); color:var(--white); }
.btn-block{ width:100%; height:48px; font-size:14px; }
.btn-ai{ background:var(--ai); border-color:var(--ai); color:#1B0E38; }
.btn.is-done{
  background:transparent; border-color:rgba(111,207,151,.45); color:var(--green);
  animation:pop .4s var(--ease);
}
@keyframes pop{ 0%{ transform:scale(.9) } 55%{ transform:scale(1.05) } 100%{ transform:scale(1) } }
.btn.is-saved{ color:var(--brand); border-color:var(--brand-line); }

/* ---------- tabs ---------- */
.tabs{ display:flex; gap:7px; overflow-x:auto; padding:4px var(--pad) 14px; scrollbar-width:none; background:var(--ink-2); }
.tabs::-webkit-scrollbar{ display:none; }
.tab{
  flex:0 0 auto; padding:8px 14px; border-radius:100px; font-size:12.5px; font-weight:600;
  color:var(--grey); border:1px solid var(--line); transition:all .22s var(--ease);
}
.tab.on{ color:#F4F1EC; background:#1C1A18; border-color:#1C1A18; }

/* interest chips */
.interests{ display:flex; flex-wrap:wrap; gap:8px; }
.int{
  padding:9px 14px; border-radius:100px; border:1px solid var(--line);
  background:var(--surface); font-size:13px; color:var(--grey);
  display:inline-flex; align-items:center; gap:7px; transition:all .22s var(--ease);
}
.int.on{ color:var(--white); border-color:var(--brand-line); background:var(--brand-soft); }
.int:active{ transform:scale(.95); }

/* ---------- marketplace ---------- */
.grid{ display:grid; grid-template-columns:1fr 1fr; gap:11px; padding:0 var(--pad); }
.tile{ text-align:left; border-radius:var(--r-md); overflow:hidden; border:1px solid var(--line); background:var(--surface); transition:transform .2s var(--ease); }
.tile:active{ transform:scale(.97); }
.thumb{
  aspect-ratio:1/1; display:grid; place-items:center; position:relative;
  background:#EDE9E2;
}
.thumb::after{ content:""; position:absolute; inset:0; border:1px solid rgba(28,26,24,.06); }
.thumb span{ font-size:34px; filter:grayscale(.25) opacity(.9); }
.thumb.free::before{
  content:"FREE"; position:absolute; top:9px; left:9px; z-index:2;
  font-family:var(--font-mono); font-size:8.5px; letter-spacing:.16em;
  padding:4px 7px; border-radius:100px; background:#1C1A18; color:#F4F1EC;
}
.tile-body{ padding:11px 12px 13px; }
.tile-name{ font-size:13.5px; font-weight:600; letter-spacing:-.01em; }
.tile-price{ font-family:var(--font-mono); font-size:12px; color:var(--brand); margin-top:4px; }
.tile-meta{ font-size:11px; color:var(--grey-2); margin-top:6px; display:flex; align-items:center; gap:5px; }

.hero-thumb{ aspect-ratio:4/3; display:grid; place-items:center; background:#EDE9E2; border-radius:var(--r-lg); border:1px solid var(--line); position:relative; overflow:hidden; }
.hero-thumb span{ font-size:64px; }

/* ---------- list rows ---------- */
.rows{ border-radius:var(--r-lg); border:1px solid var(--line); background:var(--surface); overflow:hidden; }
.row{
  width:100%; display:flex; align-items:center; gap:12px; padding:14px 15px;
  border-bottom:1px solid var(--line); text-align:left; transition:background .18s;
}
.row:last-child{ border-bottom:0; }
.row:active{ background:var(--surface-2); }
.row-ico{ width:32px; height:32px; flex:0 0 32px; border-radius:10px; background:rgba(255,255,255,.045); display:grid; place-items:center; color:var(--grey); }
.row-ico svg{ width:15px; height:15px; }
.row-main{ flex:1; min-width:0; }
.row-title{ font-size:14px; font-weight:600; }
.row-sub{ font-size:12px; color:var(--grey); margin-top:2px; }
.row-right{ color:var(--grey-2); display:flex; align-items:center; gap:8px; font-size:12px; }
.row-right svg{ width:15px; height:15px; }

/* toggle */
.tog{ width:44px; height:26px; flex:0 0 44px; border-radius:100px; background:rgba(255,255,255,.10); position:relative; transition:background .25s var(--ease); }
.tog i{ position:absolute; top:3px; left:3px; width:20px; height:20px; border-radius:50%; background:var(--white); transition:transform .25s var(--ease); }
.tog.on{ background:var(--brand); }
.tog.on i{ transform:translateX(18px); background:#FFFFFF; }

/* ---------- notifications ---------- */
.note{ display:flex; gap:12px; padding:14px 0; border-bottom:1px solid var(--line); }
.note:last-child{ border-bottom:0; }
.note-dot{ width:7px; height:7px; border-radius:50%; background:var(--brand); margin-top:7px; flex:0 0 7px; }
.note-dot.read{ background:var(--line-2); }
.note-title{ font-size:14px; font-weight:600; }
.note-sub{ font-size:12.5px; color:var(--grey); margin-top:3px; }
.note-time{ font-family:var(--font-mono); font-size:9.5px; letter-spacing:.14em; color:var(--grey-2); margin-top:6px; text-transform:uppercase; }

/* ---------- AI ---------- */
.ai-head{ padding:calc(env(safe-area-inset-top) + 22px) var(--pad) 4px; text-align:center; }
.ai-orb{ width:74px; height:74px; margin:0 auto 14px; position:relative; }
.ai-orb svg{ width:100%; height:100%; }
.ai-orb .ring{ stroke:rgba(201,174,255,.5); transform-origin:50% 50%; }
.ai-orb .ring.a{ stroke-dasharray:70 300; animation:spin 6s linear infinite; }
.ai-orb .ring.b{ stroke-dasharray:40 200; animation:spin 4s linear infinite reverse; }
.ai-orb .core{ fill:var(--ai); }
.thread{ padding:14px var(--pad) 0; display:flex; flex-direction:column; gap:12px; }
.msg{ max-width:84%; padding:12px 15px; border-radius:18px; font-size:14px; line-height:1.5; animation:cardIn .4s var(--ease) both; }
.msg.me{ align-self:flex-end; background:#1C1A18; color:#F4F1EC; border-radius:3px; font-weight:500; }
.msg.ai{ align-self:flex-start; background:var(--surface); border:1px solid var(--line); border-radius:3px; }
.msg.ai.tint{ border-color:rgba(201,174,255,.28); background:linear-gradient(160deg,var(--ai-soft),var(--surface) 70%); }
.msg-card{ align-self:flex-start; width:88%; animation:cardIn .4s var(--ease) both; }
.dots{ display:inline-flex; gap:4px; align-items:center; height:14px; }
.dots i{ width:5px; height:5px; border-radius:50%; background:var(--ai); opacity:.4; animation:bob 1.1s ease-in-out infinite; }
.dots i:nth-child(2){ animation-delay:.15s } .dots i:nth-child(3){ animation-delay:.3s }
@keyframes bob{ 0%,100%{ transform:translateY(0); opacity:.35 } 50%{ transform:translateY(-4px); opacity:1 } }
.suggests{ display:flex; flex-direction:column; gap:8px; padding:16px var(--pad) 0; }
.sugg{
  text-align:left; padding:13px 15px; border-radius:14px; font-size:13.5px;
  border:1px solid var(--line); background:var(--surface); color:var(--white);
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  transition:transform .18s var(--ease), border-color .2s;
}
.sugg:active{ transform:scale(.98); }
.sugg svg{ width:14px; height:14px; color:var(--grey-2); flex:0 0 14px; }

/* composer */
.composer{
  padding:10px var(--pad); display:flex; gap:9px; align-items:center;
  background:rgba(14,9,32,.94);
  backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
  border-top:1px solid var(--line);
}
.composer input{
  flex:1; height:44px; border-radius:100px; padding:0 17px;
  background:var(--surface); border:1px solid var(--line); outline:none; font-size:14px;
}
.composer input::placeholder{ color:var(--grey-2); }
.composer input:focus{ border-color:var(--line-2); }
.send{ width:44px; height:44px; flex:0 0 44px; border-radius:50%; background:var(--brand); color:#FFFFFF; display:grid; place-items:center; }
.send svg{ width:17px; height:17px; }

/* ---------- profile ---------- */
.profile-head{ padding:8px var(--pad) 0; display:flex; align-items:center; gap:14px; }
.p-name{ font-family:var(--font-display); font-weight:400; font-size:23px; }
.stats{ display:flex; gap:9px; padding:18px var(--pad) 0; }
.stat{ flex:1; padding:13px 12px; border-radius:var(--r-md); background:var(--surface); border:1px solid var(--line); }
.stat b{ font-family:var(--font-display); font-weight:400; font-size:21px; display:block; }
.stat span{ font-family:var(--font-mono); font-size:8.5px; letter-spacing:.16em; text-transform:uppercase; color:var(--grey-2); }

.privacy-note{
  margin:0 var(--pad); padding:14px 15px; border-radius:var(--r-md);
  background:var(--brand-soft); border:1px solid var(--brand-line);
  font-size:12.5px; color:#DCCDFF; display:flex; gap:10px; align-items:flex-start;
}
.privacy-note svg{ width:15px; height:15px; flex:0 0 15px; color:var(--brand); margin-top:1px; }

/* ---------- concept diagram ---------- */
.concept{ padding:0 var(--pad); }
.diagram{ width:100%; height:250px; }
.diagram text{ font-family:var(--font-mono); font-size:8px; letter-spacing:.18em; fill:var(--grey); text-transform:uppercase; }
.diagram .node{ fill:var(--surface); stroke:var(--line-2); }
.diagram .node.me{ fill:var(--brand); stroke:var(--brand); }
.diagram .conn{ stroke:var(--brand-line); stroke-width:1; stroke-dasharray:3 4; animation:dash 14s linear infinite; }
.diagram .halo{ fill:none; stroke:var(--line); }
@keyframes dash{ to{ stroke-dashoffset:-140 } }
.compare{ display:flex; flex-direction:column; gap:10px; margin-top:6px; }
.compare div{ padding:14px 15px; border-radius:var(--r-md); border:1px solid var(--line); background:var(--surface); }
.compare .lbl{ font-family:var(--font-mono); font-size:9px; letter-spacing:.2em; text-transform:uppercase; color:var(--grey-2); margin-bottom:7px; }
.compare .flow{ font-family:var(--font-display); font-size:15px; font-weight:300; letter-spacing:.04em; color:var(--grey); }
.compare .flow.accent{ color:var(--brand); }

/* ---------- tab bar ---------- */
.tabbar{
  position:absolute; left:0; right:0; bottom:0; z-index:30;
  height:calc(70px + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom);
  display:flex; align-items:center;
  background:rgba(244,241,236,.94);
  backdrop-filter:blur(18px) saturate(120%);
  -webkit-backdrop-filter:blur(18px) saturate(120%);
  border-top:1px solid var(--line-2);
}
.tabbtn{
  flex:1; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px;
  color:var(--grey-2); transition:color .22s var(--ease);
}
.tabbtn svg{ width:20px; height:20px; transition:transform .22s var(--ease); }
.tabbtn span{ font-family:var(--font-mono); font-size:8px; letter-spacing:.14em; text-transform:uppercase; }
.tabbtn.on{ color:#1C1A18; }
.tabbtn.on svg{ transform:translateY(-1px); }
.tabbtn.ai.on{ color:var(--ai); }
.tabbtn:active svg{ transform:scale(.88); }

/* FAB */
.fab{
  position:absolute; right:18px; bottom:calc(86px + env(safe-area-inset-bottom)); z-index:29;
  height:46px; padding:0 18px; border-radius:2px; background:#1C1A18; color:#F4F1EC;
  font-size:13.5px; font-weight:700; display:inline-flex; align-items:center; gap:7px;
  box-shadow:0 10px 24px -10px rgba(28,26,24,.45);
  animation:cardIn .45s var(--ease) both;
}
.fab:active{ transform:scale(.94); }
.fab svg{ width:15px; height:15px; }

/* ---------- sheet ---------- */
.scrim{
  position:fixed; inset:0; z-index:80; background:rgba(4,5,8,.65);
  backdrop-filter:blur(3px); opacity:0; pointer-events:none; transition:opacity .3s var(--ease);
}
.scrim.on{ opacity:1; pointer-events:auto; }
.sheet{
  position:fixed; z-index:90; left:50%; bottom:0; width:400px; max-width:100%;
  transform:translate(-50%,102%);
  background:var(--ink-2); border:1px solid var(--line); border-bottom:0;
  border-radius:28px 28px 0 0; padding:10px var(--pad) calc(24px + env(safe-area-inset-bottom));
  max-height:86vh; overflow-y:auto; scrollbar-width:none;
  transition:transform .42s var(--ease);
}
.sheet::-webkit-scrollbar{ display:none; }
.sheet.on{ transform:translate(-50%,0); }
.grabber{ width:38px; height:4px; border-radius:100px; background:var(--line-2); margin:0 auto 16px; }
.sheet h3{ font-family:var(--font-display); font-weight:400; font-size:22px; margin-bottom:5px; }
.sheet .sub{ color:var(--grey); font-size:13px; margin-bottom:16px; }

/* forms */
.field{ margin-bottom:12px; }
.field label{ display:block; font-family:var(--font-mono); font-size:9px; letter-spacing:.18em; text-transform:uppercase; color:var(--grey-2); margin-bottom:7px; }
.field input,.field textarea,.field select{
  width:100%; background:var(--surface); border:1px solid var(--line);
  border-radius:12px; padding:13px 14px; font-size:14px; outline:none;
}
.field textarea{ resize:none; min-height:74px; }
.field input:focus,.field textarea:focus,.field select:focus{ border-color:var(--brand-line); }
.field-2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.picker{ display:grid; grid-template-columns:1fr 1fr; gap:9px; margin-bottom:6px; }
.pick{
  padding:15px 14px; border-radius:14px; border:1px solid var(--line); background:var(--surface);
  text-align:left; transition:all .2s var(--ease);
}
.pick b{ display:block; font-size:14px; font-weight:600; }
.pick span{ font-size:11.5px; color:var(--grey-2); }
.pick.on{ border-color:var(--brand-line); background:var(--brand-soft); }
.uploader{
  min-height:104px; border-radius:14px; border:1px dashed var(--line-2);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px;
  color:var(--grey-2); margin-bottom:12px; background:var(--surface); padding:16px 14px;
  transition:border-color .2s, background .2s;
}
.uploader:active{ border-color:var(--brand-line); background:var(--surface-2); }
.up-plus{
  width:34px; height:34px; border-radius:50%; display:grid; place-items:center;
  background:var(--brand-soft); border:1px solid var(--brand-line); color:var(--brand);
}
.up-plus svg{ width:16px; height:16px; }
.up-label{ font-size:13px; font-weight:600; color:var(--white); }
.up-hint{ font-size:11.5px; color:var(--grey-2); }
.uploader.has{ border-style:solid; border-color:var(--brand-line); }
.up-thumbs{ display:flex; gap:8px; align-items:center; margin-bottom:4px; }
.up-thumbs img{ width:56px; height:56px; border-radius:11px; object-fit:cover; border:1px solid var(--line-2); }
.up-more{
  width:34px; height:56px; border-radius:11px; display:grid; place-items:center;
  border:1px dashed var(--line-2); color:var(--grey-2);
}
.up-more svg{ width:14px; height:14px; }
.thumb-img{ width:100%; height:100%; object-fit:cover; position:absolute; inset:0; }
.req-photo{ width:100%; height:120px; object-fit:cover; border-radius:12px; margin-bottom:12px; }

/* ---------- toast ---------- */
.toast{
  position:absolute; left:50%; bottom:calc(94px + env(safe-area-inset-bottom)); z-index:70;
  transform:translate(-50%,14px); opacity:0; pointer-events:none;
  padding:11px 18px; border-radius:100px; font-size:13px; font-weight:600;
  background:var(--brand); color:#fff;
  display:flex; align-items:center; gap:8px;
  transition:opacity .3s var(--ease), transform .3s var(--ease);
  box-shadow:0 14px 30px -14px rgba(28,26,24,.5);
}
.toast.on{ opacity:1; transform:translate(-50%,0); }
.toast svg{ width:14px; height:14px; }

/* ---------- misc ---------- */
.empty{ text-align:center; padding:50px var(--pad); color:var(--grey-2); font-size:13px; }
.divider{ height:1px; background:var(--line); margin:22px var(--pad); }
.badge-line{ display:flex; align-items:center; gap:8px; font-size:12px; color:var(--grey); }

.hero-quote{
  margin:22px var(--pad) 0; padding:28px 20px; border-radius:var(--r-lg);
  border:0; background:#1C1A18;
  text-align:center; color:#F4F1EC;
}
.hero-quote h4{ font-family:var(--font-brand); font-weight:400; font-size:22px; letter-spacing:.01em; }
.hero-quote p{ font-family:var(--font-mono); font-size:9.5px; letter-spacing:.2em; text-transform:uppercase; color:rgba(255,255,255,.75); margin-top:10px; }

/* ---------- responsive ---------- */
@media (max-width:520px){
  body{ display:block; }
  .ambience{ display:none; }
  .stage{ gap:0; }
  .device{ width:100vw; height:100dvh; border:0; border-radius:0; box-shadow:none; }
  .stage-note{ display:none; }
  .sheet{ width:100%; }
}
@media (max-height:700px) and (min-width:521px){
  .device{ height:94vh; }
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{ animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important; }
}

:focus-visible{ outline:2px solid var(--brand); outline-offset:2px; border-radius:8px; }

/* ---------- added for the demo build: undo, slots, pass, tracking, tour ---------- */
.toast-undo{
  margin-left:6px; padding:4px 10px; border-radius:100px;
  background:rgba(255,255,255,.22); color:#fff; font-size:12px; font-weight:700;
}
.toast-undo:active{ transform:scale(.94); }

/* amenity time slots */
.slots{ display:grid; grid-template-columns:repeat(3,1fr); gap:9px; }
.slot{
  padding:14px 6px; border-radius:14px; border:1px solid var(--line); background:var(--surface);
  font-size:13.5px; font-weight:600; transition:all .2s var(--ease); position:relative;
}
.slot.on{ border-color:var(--brand); background:var(--brand-soft); color:var(--white); }
.slot.taken{ opacity:.4; }
.slot.taken i{ display:block; font-style:normal; font-family:var(--font-mono); font-size:8px; letter-spacing:.14em; text-transform:uppercase; color:var(--grey-2); margin-top:3px; }
.slot:active{ transform:scale(.96); }

/* visitor gate pass */
.pass{
  border-radius:24px; padding:26px 22px; text-align:center;
  background:linear-gradient(160deg,#9E69FF,#6F3FD6);
  border:1px solid rgba(255,255,255,.18); color:#fff;
  box-shadow:0 24px 60px -22px rgba(158,105,255,.75);
}
.pass-eyebrow{ font-family:var(--font-mono); font-size:9px; letter-spacing:.22em; text-transform:uppercase; color:rgba(255,255,255,.75); }
.pass-name{ font-family:var(--font-brand); font-weight:400; font-size:28px; margin-top:10px; }
.pass-sub{ font-size:12.5px; color:rgba(255,255,255,.85); margin-top:5px; }
.pass-qr{ background:#fff; width:186px; height:186px; margin:20px auto 14px; border-radius:16px; display:grid; place-items:center; }
.pass-code{ font-family:var(--font-mono); font-size:22px; letter-spacing:.34em; margin-right:-.34em; }
.pass-meta{
  display:flex; justify-content:space-between; margin-top:18px; padding-top:14px;
  border-top:1px solid rgba(255,255,255,.25);
  font-family:var(--font-mono); font-size:9px; letter-spacing:.14em; text-transform:uppercase; color:rgba(255,255,255,.8);
}

/* maintenance progress */
.track{ display:flex; gap:6px; margin-top:16px; }
.track-step{ flex:1; }
.track-step i{ display:block; height:3px; border-radius:100px; background:rgba(255,255,255,.10); }
.track-step.on i{ background:var(--brand); }
.track-step span{
  display:block; margin-top:7px; font-family:var(--font-mono); font-size:8px;
  letter-spacing:.1em; text-transform:uppercase; color:var(--grey-2);
}
.track-step.on span{ color:var(--white); }

/* guided tour */
.tourbar{
  position:absolute; left:12px; right:12px; bottom:calc(80px + env(safe-area-inset-bottom)); z-index:40;
  padding:16px 18px 14px; border-radius:20px;
  background:rgba(23,16,43,.96); border:1px solid var(--brand-line);
  backdrop-filter:blur(20px); box-shadow:0 20px 50px -18px rgba(0,0,0,.9);
  animation:cardIn .4s var(--ease) both;
}
.tour-step{ font-family:var(--font-mono); font-size:9px; letter-spacing:.2em; text-transform:uppercase; color:var(--brand); }
.tour-text{ font-size:14px; line-height:1.5; margin-top:8px; }
.tour-actions{ display:flex; gap:8px; justify-content:flex-end; margin-top:14px; }
.tour-actions .btn{ height:34px; font-size:12.5px; }

/* ---------- collapsing home header ---------- */
.minibar{
  position:sticky; top:0; z-index:25;
  margin-bottom:-1px;
  padding:calc(env(safe-area-inset-top) + 12px) var(--pad) 12px;
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  background:rgba(14,9,32,.72);
  backdrop-filter:blur(22px) saturate(160%);
  -webkit-backdrop-filter:blur(22px) saturate(160%);
  border-bottom:1px solid transparent;
  opacity:0; transform:translateY(-6px); pointer-events:none;
  transition:opacity .28s var(--ease), transform .28s var(--ease), border-color .28s;
}
.minibar.on{ opacity:1; transform:none; pointer-events:auto; border-bottom-color:var(--line); }
.mini-mark{ text-align:right; line-height:1; }
.mini-mark b{ display:block; font-family:var(--font-brand); font-weight:400; font-size:19px; letter-spacing:.05em; }
.mini-mark span{ display:block; font-family:var(--font-display); font-weight:200; font-size:6.5px; letter-spacing:.44em; margin-right:-.44em; margin-top:3px; color:var(--grey); }

/* the full greeting now scrolls away instead of pinning over the cards */
.topbar.bigbar{
  position:static; background:none;
  padding-top:14px;
  transition:opacity .28s var(--ease), transform .28s var(--ease);
}
.topbar.bigbar.gone{ opacity:0; transform:translateY(-8px); }

/* ---------- creator credit ---------- */
.credit{ margin:22px var(--pad) 0; padding:22px 20px; border-radius:var(--r-lg); border:1px solid var(--line); background:var(--surface); }
.credit-people{ display:flex; flex-direction:column; gap:14px; margin-top:14px; }
.credit-person{ display:flex; align-items:center; gap:12px; }
.credit-person p{ font-size:14.5px; font-weight:600; }
.credit-person span{ font-family:var(--font-mono); font-size:9px; letter-spacing:.16em; text-transform:uppercase; color:var(--grey-2); }
.credit-note{ margin-top:18px; padding-top:14px; border-top:1px solid var(--line); font-family:var(--font-mono); font-size:9px; letter-spacing:.16em; text-transform:uppercase; color:var(--grey-2); }

/* ---------- live occupancy ---------- */
.occ-top{ display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
.occ-word{ display:flex; align-items:center; gap:7px; font-size:12.5px; font-weight:600; }
.occ-count{ font-family:var(--font-mono); font-size:11px; color:var(--grey); }
.occ-bar{ height:6px; border-radius:100px; background:rgba(255,255,255,.08); overflow:hidden; }
.occ-bar i{ display:block; height:100%; border-radius:100px; background:var(--green); transition:width .8s var(--ease); }
.occ.steady .occ-bar i{ background:var(--brand); }
.occ.busy .occ-bar i{ background:#E8A05C; }
.occ.quiet .live-dot{ background:var(--green); }
.occ.steady .live-dot{ background:var(--brand); }
.occ.busy .live-dot{ background:#E8A05C; }

/* busy-times chart */
.busy{ display:flex; align-items:flex-end; gap:4px; height:92px; }
.busy-bar{ flex:1; height:100%; display:flex; align-items:flex-end; }
.busy-bar i{ display:block; width:100%; border-radius:4px 4px 2px 2px; background:rgba(255,255,255,.12); }
.busy-bar.now i{ background:var(--brand); }
.busy-axis{ display:flex; justify-content:space-between; margin-top:8px; font-family:var(--font-mono); font-size:8.5px; letter-spacing:.14em; color:var(--grey-2); }

/* phone-as-key card */
.keycard{
  border-radius:24px; padding:24px 22px; text-align:center; color:#fff;
  background:linear-gradient(160deg,#2A1D4D,#150E2A);
  border:1px solid var(--brand-line);
  box-shadow:0 24px 60px -24px rgba(0,0,0,.9);
}
.key-refresh{
  display:flex; align-items:center; justify-content:center; gap:7px; margin-top:10px;
  font-family:var(--font-mono); font-size:9px; letter-spacing:.18em; text-transform:uppercase; color:var(--grey);
}

/* drone tracking */
.dronebox{ border-radius:22px; border:1px solid var(--line); background:var(--surface); padding:20px; }
.drone-sky{
  position:relative; height:96px; border-radius:16px; overflow:hidden;
  background:linear-gradient(180deg,#2A1D4D,#120B24);
}
.drone-sky .drone{ position:absolute; top:26px; font-size:26px; transition:left 1s var(--ease); }
.drone-sky .pad{
  position:absolute; right:14px; bottom:12px; width:38px; height:8px; border-radius:100px;
  background:var(--brand); box-shadow:0 0 22px 4px rgba(158,105,255,.55);
}
.drone-eta{ text-align:center; margin-top:14px; font-family:var(--font-brand); font-size:22px; }


/* ---------- pinned composer sits between the feed and the tab bar ---------- */
#composerSlot{
  flex:0 0 auto; position:relative; z-index:31;
  /* the tab bar is absolutely positioned over the bottom, so sit clear of it */
  margin-bottom:calc(70px + env(safe-area-inset-bottom));
}
#composerSlot:empty{ display:none; margin-bottom:0; }
.composer input{ min-width:0; }

/* ---------- language chooser ---------- */
.langLayer{
  position:absolute; inset:0; z-index:55;
  background:radial-gradient(125% 90% at 50% 25%, #241748 0%, var(--ink) 70%);
  opacity:0; pointer-events:none;
  transition:opacity .45s var(--ease);
  overflow-y:auto; scrollbar-width:none;
}
.langLayer::-webkit-scrollbar{ display:none; }
.langLayer.on{ opacity:1; pointer-events:auto; }
.langwrap{
  min-height:100%; padding:calc(env(safe-area-inset-top) + 46px) var(--pad) calc(28px + env(safe-area-inset-bottom));
  display:flex; flex-direction:column;
}
.lang-mark{ text-align:center; margin-bottom:26px; }
.lang-mark b{ display:block; font-family:var(--font-brand); font-weight:400; font-size:30px; letter-spacing:.05em; }
.lang-mark span{ display:block; font-family:var(--font-display); font-weight:200; font-size:8px; letter-spacing:.46em; margin-right:-.46em; margin-top:5px; color:var(--brand); }
.lang-title{ font-family:var(--font-display); font-weight:300; font-size:26px; text-align:center; }
.lang-sub{ color:var(--grey); font-size:13px; text-align:center; margin-top:8px; margin-bottom:24px; }

.lang-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.lang-opt{
  display:flex; align-items:center; gap:10px; padding:14px 13px;
  border-radius:16px; border:1px solid var(--line); background:var(--surface);
  text-align:left; position:relative; transition:all .22s var(--ease);
}
.lang-opt:active{ transform:scale(.97); }
.lang-opt.on{ border-color:var(--brand); background:var(--brand-soft); }
.lang-flag{ font-size:24px; line-height:1; flex:0 0 auto; }
.lang-names{ min-width:0; flex:1; }
.lang-names b{ display:block; font-size:15px; font-weight:600; letter-spacing:0; }
.lang-names i{
  display:block; font-style:normal; font-family:var(--font-mono);
  font-size:8.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--grey-2); margin-top:3px;
}
.lang-tick{ opacity:0; color:var(--brand); flex:0 0 16px; transition:opacity .2s; }
.lang-tick svg{ width:16px; height:16px; }
.lang-opt.on .lang-tick{ opacity:1; }
.lang-go{ margin-top:auto; }
.lang-grid + .lang-go{ margin-top:26px; }

/* right-to-left support for Arabic and Urdu */
.device.rtl .topbar,
.device.rtl .card-actions,
.device.rtl .row,
.device.rtl .people,
.device.rtl .composer,
.device.rtl .section-head,
.device.rtl .signal .sig-top{ flex-direction:row-reverse; }
.device.rtl .card-eyebrow{ flex-direction:row-reverse; }
.device.rtl .row-main,
.device.rtl .card,
.device.rtl .signal,
.device.rtl .sugg,
.device.rtl .tile-body{ text-align:right; }
.device.rtl .msg.me{ align-self:flex-start; border-radius:18px 18px 18px 6px; }
.device.rtl .msg.ai{ align-self:flex-end; border-radius:18px 18px 6px 18px; }
.device.rtl .avatars .av{ margin-left:0; margin-right:-9px; }
.device.rtl .avatars .av:first-child{ margin-right:0; }
.device.rtl .mark,
.device.rtl .lang-mark{ text-align:center; }
.device.rtl .lang-opt{ flex-direction:row-reverse; text-align:right; }

/* ---------- account / sign in ---------- */
.authLayer{
  position:absolute; inset:0; z-index:58;
  background:radial-gradient(130% 90% at 50% 18%, #251650 0%, var(--ink) 72%);
  opacity:0; pointer-events:none; transition:opacity .45s var(--ease);
  overflow-y:auto; scrollbar-width:none;
}
.authLayer::-webkit-scrollbar{ display:none; }
.authLayer.on{ opacity:1; pointer-events:auto; }
.authwrap{
  min-height:100%; padding:calc(env(safe-area-inset-top) + 40px) var(--pad) calc(30px + env(safe-area-inset-bottom));
  display:flex; flex-direction:column; position:relative;
}
.authwrap.center{ justify-content:center; align-items:center; text-align:center; }
.authwrap.center .btn-block{ max-width:320px; }
.auth-mark{ text-align:center; margin-bottom:22px; }
.auth-mark b{ display:block; font-family:var(--font-brand); font-weight:400; font-size:28px; letter-spacing:.05em; }
.auth-mark span{ display:block; font-family:var(--font-display); font-weight:200; font-size:7.5px; letter-spacing:.46em; margin-right:-.46em; margin-top:5px; color:var(--brand); }
.auth-title{ font-family:var(--font-display); font-weight:300; font-size:27px; line-height:1.2; }
.auth-sub{ color:var(--grey); font-size:13.5px; margin-top:9px; margin-bottom:20px; max-width:34em; }
.authwrap.center .auth-sub{ margin-inline:auto; }
.auth-err{
  background:rgba(232,120,120,.12); border:1px solid rgba(232,120,120,.4);
  color:#F0B0B0; font-size:12.5px; padding:11px 13px; border-radius:12px; margin-bottom:12px;
}
.auth-link{ display:block; margin:14px auto 0; color:var(--brand); font-size:13px; }
.auth-skip{
  position:absolute; top:calc(env(safe-area-inset-top) + 16px); right:var(--pad);
  font-family:var(--font-mono); font-size:9px; letter-spacing:.18em; text-transform:uppercase; color:var(--grey-2);
}
.auth-back{
  position:absolute; top:calc(env(safe-area-inset-top) + 12px); left:var(--pad);
  width:36px; height:36px; border-radius:50%; border:1px solid var(--line);
  background:var(--surface); display:grid; place-items:center; color:var(--white);
}
.auth-back svg{ width:16px; height:16px; }
.auth-fine{ font-size:11.5px; color:var(--grey-2); text-align:center; margin-top:6px; }

/* segmented email / phone */
.seg{ display:flex; gap:4px; padding:4px; border-radius:100px; background:var(--surface); border:1px solid var(--line); margin-bottom:16px; }
.seg-opt{ flex:1; padding:9px; border-radius:100px; font-size:13px; font-weight:600; color:var(--grey); transition:all .2s var(--ease); }
.seg-opt.on{ background:var(--brand); color:#fff; }

/* three-step progress */
.steps-bar{ display:flex; gap:6px; margin-bottom:20px; }
.steps-bar i{ flex:1; height:3px; border-radius:100px; background:rgba(255,255,255,.10); transition:background .3s; }
.steps-bar i.on{ background:var(--brand); }

/* six digit code */
.otp{ display:flex; gap:9px; justify-content:center; margin:6px 0 14px; }
.otp-box{
  width:46px; height:56px; border-radius:14px; border:1px solid var(--line);
  background:var(--surface); display:grid; place-items:center;
  font-family:var(--font-mono); font-size:22px; transition:all .2s var(--ease);
}
.otp-box.full{ border-color:var(--brand-line); background:var(--brand-soft); }
.otp-box.cur{ border-color:var(--brand); box-shadow:0 0 0 3px var(--brand-soft); }
.otp-hidden{ position:absolute; opacity:0; height:1px; width:1px; pointer-events:none; }
.otp-hint{
  text-align:center; font-family:var(--font-mono); font-size:10px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--grey-2); margin-bottom:16px;
}
.otp-hint b{ color:var(--brand); letter-spacing:.2em; }

/* face id */
.faceid-orb{
  width:118px; height:118px; margin:0 auto 24px; border-radius:34px;
  display:grid; place-items:center; color:var(--brand);
  border:1px solid var(--brand-line); background:var(--brand-soft);
  position:relative; overflow:hidden; transition:color .4s, border-color .4s, background .4s;
}
.faceid-orb::after{
  content:""; position:absolute; left:0; right:0; height:2px; top:-4px;
  background:linear-gradient(90deg,transparent,var(--brand),transparent);
  opacity:0;
}
.faceid-orb.scanning::after{ opacity:1; animation:scanline 1.2s var(--ease) infinite; }
@keyframes scanline{ 0%{ top:6% } 100%{ top:94% } }
.faceid-orb.ok{ color:var(--green); border-color:rgba(111,207,151,.5); background:rgba(111,207,151,.12); }
.faceid-orb.ok svg{ animation:pop .45s var(--ease); }

/* rtl for the account screens */
.device.rtl .authwrap{ text-align:right; }
.device.rtl .auth-back{ left:auto; right:var(--pad); transform:scaleX(-1); }
.device.rtl .auth-skip{ right:auto; left:var(--pad); }
.device.rtl .authwrap.center{ text-align:center; }

/* ---------- building memory ---------- */
.memhero{
  padding:22px 20px; border-radius:var(--r-lg);
  border:1px solid var(--brand-line);
  background:linear-gradient(160deg,var(--brand-soft),var(--surface) 65%);
}
.mem-stat{ font-family:var(--font-display); font-weight:300; font-size:17px; color:var(--white); }
.mem-stat b{ font-family:var(--font-brand); font-weight:400; font-size:34px; color:var(--brand); display:block; line-height:1; margin-bottom:6px; }
.mem-line{ font-size:13.5px; line-height:1.6; color:var(--grey); margin-top:12px; }
.vouch{
  flex:0 0 auto; min-width:38px; height:38px; padding:0 9px; border-radius:12px;
  display:grid; place-items:center; font-family:var(--font-mono); font-size:13px;
  color:var(--brand); background:var(--brand-soft); border:1px solid var(--brand-line);
}

/* ---------- quiet introductions ---------- */
.quiethero{
  padding:24px 20px; border-radius:var(--r-lg); text-align:center;
  border:1px solid var(--line); background:var(--surface);
}
.quiet-icons{
  width:56px; height:56px; margin:0 auto; border-radius:18px; display:grid; place-items:center;
  color:var(--brand); background:var(--brand-soft); border:1px solid var(--brand-line);
}
.quiet-icons svg{ width:24px; height:24px; }
.card.matched{ border-color:rgba(111,207,151,.45); background:linear-gradient(160deg,rgba(111,207,151,.10),var(--surface) 65%); }
.matched-note{
  display:flex; gap:10px; align-items:flex-start; margin-top:12px; padding:12px 13px;
  border-radius:12px; background:rgba(111,207,151,.10); border:1px solid rgba(111,207,151,.32);
  font-size:12.5px; color:#BFEBD2;
}
.matched-note svg{ width:15px; height:15px; flex:0 0 15px; color:var(--green); margin-top:1px; }

/* ---------- editorial refinements ---------- */
.topbar{ background:linear-gradient(to bottom, var(--ink-2) 66%, rgba(244,241,236,0)); }
.topbar.solid{ background:var(--ink-2); border-bottom:1px solid var(--line-2); }
.minibar{ background:rgba(244,241,236,.88); border-bottom-color:var(--line-2); }
.mini-mark span{ color:var(--grey-2); }
.tabs{ background:var(--ink-2); }

/* eyebrows become editorial kickers */
.card-eyebrow{ color:var(--grey-2); letter-spacing:.24em; }
.card-eyebrow .tick{ background:#1C1A18; width:18px; }
.eyebrow{ letter-spacing:.26em; }

/* section headings get a hairline rule, like a magazine */
.section-head{ border-bottom:1px solid var(--line); padding-bottom:9px; align-items:center; }
.section-head h2{ color:#1C1A18; letter-spacing:.18em; font-size:11px; }

/* signals: flat tiles, no glow */
.signal{ border-radius:3px; background:var(--surface); }
.signal.is-live{ background:var(--surface); border-color:#1C1A18; }
.signal.is-live .sig-top{ color:#1C1A18; }
.sig-value{ font-family:var(--font-display); font-weight:400; font-size:16px; letter-spacing:-.01em; }

/* rows */
.rows{ border-radius:3px; }
.row-ico{ border-radius:2px; background:var(--surface-2); color:#1C1A18; }
.tog{ background:rgba(28,26,24,.14); }
.tog.on{ background:#1C1A18; }
.tog i{ background:#fff; }
.tog.on i{ background:#F4F1EC; }

/* interests / segmented */
.int{ border-radius:2px; background:var(--surface); color:var(--grey); }
.int.on{ background:#1C1A18; color:#F4F1EC; border-color:#1C1A18; }
.seg{ border-radius:2px; background:var(--surface); }
.seg-opt{ border-radius:2px; }
.seg-opt.on{ background:#1C1A18; color:#F4F1EC; }
.pick{ border-radius:3px; }
.pick.on{ border-color:#1C1A18; background:var(--surface-2); }

/* tiles + grids */
.tile{ border-radius:3px; }
.tile-price{ color:#1C1A18; font-weight:500; }
.hero-thumb{ border-radius:3px; }
.thumb.free::before{ background:#1C1A18; color:#F4F1EC; border-radius:2px; }

/* forms */
.field input,.field textarea,.field select{ border-radius:2px; background:var(--surface); }
.field input:focus,.field textarea:focus,.field select:focus{ border-color:#1C1A18; }
.uploader{ border-radius:3px; background:var(--surface); }
.up-plus{ background:var(--surface-2); border-color:var(--line-2); color:#1C1A18; }
.otp-box{ border-radius:3px; background:var(--surface); }
.otp-box.full{ background:var(--surface-2); border-color:var(--line-2); }
.otp-box.cur{ border-color:#1C1A18; box-shadow:none; }

/* notes and panels */
.privacy-note{ border-radius:3px; background:var(--surface); border-color:var(--line-2); color:var(--grey); }
.privacy-note svg{ color:#1C1A18; }
.memhero{ border-radius:3px; background:var(--surface); border-color:var(--line-2); }
.mem-stat b{ color:#1C1A18; }
.vouch{ border-radius:2px; background:var(--surface-2); border-color:var(--line-2); color:#1C1A18; }
.quiethero{ border-radius:3px; }
.quiet-icons{ border-radius:3px; background:var(--surface-2); border-color:var(--line-2); color:#1C1A18; }
.keycard{ background:#1C1A18; border-color:#1C1A18; color:#F4F1EC; }
.pass{ background:#1C1A18; border:0; box-shadow:0 18px 44px -22px rgba(28,26,24,.6); }
.pass-qr{ border-radius:3px; }
.dronebox{ border-radius:3px; }
.drone-sky{ border-radius:3px; background:#1C1A18; }
.hero-quote{ border-radius:3px; }
.hero-quote p{ color:rgba(244,241,236,.7); }
.credit{ border-radius:3px; }

/* sheets and overlays */
.sheet{ background:var(--ink-2); border-radius:6px 6px 0 0; border-color:var(--line-2); }
.grabber{ background:var(--line-2); }
.scrim{ background:rgba(28,26,24,.34); }
.authLayer{ background:var(--ink); }
.langLayer{ background:var(--ink); }
.lang-opt{ border-radius:3px; }
.lang-opt.on{ border-color:#1C1A18; background:var(--surface-2); }
.lang-mark span,.auth-mark span{ color:var(--brand); }
.faceid-orb{ border-radius:6px; background:var(--surface); border-color:var(--line-2); color:#1C1A18; }
.faceid-orb::after{ background:linear-gradient(90deg,transparent,#1C1A18,transparent); }
.steps-bar i{ background:rgba(28,26,24,.14); }
.steps-bar i.on{ background:#1C1A18; }
.auth-err{ background:rgba(160,60,60,.07); border-color:rgba(160,60,60,.3); color:#8C3A3A; }

/* composer + AI */
.composer{ background:rgba(244,241,236,.96); border-top-color:var(--line-2); }
.composer input{ border-radius:2px; background:var(--surface); }
.send{ border-radius:2px; background:#1C1A18; color:#F4F1EC; }
.sugg{ border-radius:3px; background:var(--surface); }
.ai-orb .ring{ stroke:rgba(28,26,24,.35); }
.ai-orb .core{ fill:#1C1A18; }
.dots i{ background:#1C1A18; }
.msg.ai.tint{ background:var(--surface); border-color:var(--line); }
.btn-ai{ background:#1C1A18; border-color:#1C1A18; color:#F4F1EC; }

/* occupancy + charts read as print */
.occ-bar{ background:rgba(28,26,24,.10); }
.occ-bar i{ background:#1C1A18; }
.occ.steady .occ-bar i{ background:var(--brand); }
.occ.busy .occ-bar i{ background:#A8622F; }
.occ.quiet .live-dot{ background:var(--green); }
.busy-bar i{ background:rgba(28,26,24,.16); }
.busy-bar.now i{ background:#1C1A18; }
.slot{ border-radius:2px; background:var(--surface); }
.slot.on{ border-color:#1C1A18; background:var(--surface-2); color:#1C1A18; }
.track-step i{ background:rgba(28,26,24,.12); }
.track-step.on i{ background:#1C1A18; }
.track-step.on span{ color:#1C1A18; }

/* tour */
.tourbar{ background:rgba(255,255,255,.97); border-color:var(--line-2); box-shadow:0 16px 40px -20px rgba(28,26,24,.4); }
.tour-step{ color:var(--brand); }

/* misc */
.toast-undo{ background:rgba(244,241,236,.22); color:#F4F1EC; border-radius:2px; }
.note-dot{ background:#1C1A18; }
.note-dot.read{ background:var(--line-2); }
.verified{ color:var(--brand); }
.link{ color:#1C1A18; text-decoration:underline; text-underline-offset:3px; text-decoration-thickness:1px; }
.stat{ border-radius:3px; }
.stat b{ font-family:var(--font-brand); }
.icon-btn{ border-radius:2px; border-color:var(--line-2); background:var(--surface); }
.compare div{ border-radius:3px; }
.diagram .node{ fill:var(--surface); stroke:var(--line-2); }
.diagram .node.me{ fill:#1C1A18; stroke:#1C1A18; }
.diagram .conn{ stroke:rgba(28,26,24,.3); }
.card.matched{ border-color:var(--line-2); background:var(--surface); }
.matched-note{ background:rgba(46,125,91,.07); border-color:rgba(46,125,91,.28); color:#2E7D5B; }
.stage-note{ color:var(--grey-2); }


/* ================= ONE Residence · live model ================= */
.bworld{
  position:relative; margin:0 var(--pad); padding:10px 0 6px;
  border:1px solid var(--line); border-radius:var(--r-lg);
  background:
    radial-gradient(120% 70% at 50% 92%, rgba(143,102,244,.12), transparent 62%),
    linear-gradient(180deg,#100D1A 0%, #171324 58%, #1D1830 100%);
  overflow:hidden; cursor:grab; touch-action:pan-y; perspective:1000px;
}
.bworld:active{ cursor:grabbing; }
/* a faint city haze behind the tower */
.bworld::before{
  content:""; position:absolute; left:0; right:0; top:0; height:62%;
  background:radial-gradient(70% 100% at 50% 100%, rgba(232,196,137,.10), transparent 70%);
  pointer-events:none;
}
.bstage{ transform-style:preserve-3d; transition:transform .1s linear; will-change:transform; }
.bsvg{ width:100%; height:330px; display:block; overflow:visible; }

/* ground */
.ground{ fill:#0C0A14; opacity:.9; }
.glowfloor{ opacity:.5; }

/* podium */
.podium .pk{  fill:#241F36; stroke:rgba(255,255,255,.05); stroke-width:.5; }
.podium .pk2{ fill:#2A2440; stroke:rgba(255,255,255,.05); stroke-width:.5; }
.podium .deck{ fill:url(#gPod); stroke:rgba(232,196,137,.18); stroke-width:.6; }

/* deck features */
.pool{ fill:rgba(120,190,220,.55); stroke:rgba(180,225,245,.5); stroke-width:.6; cursor:pointer;
       animation:shimmer 4.5s ease-in-out infinite; }
@keyframes shimmer{ 0%,100%{ opacity:.62 } 50%{ opacity:.92 } }
.court{ fill:rgba(120,200,150,.35); stroke:rgba(160,225,185,.45); stroke-width:.6; cursor:pointer; }
.helipad{ fill:none; stroke:rgba(232,196,137,.6); stroke-width:1; }
.heliH{ font-family:var(--font-mono); font-size:6px; fill:rgba(232,196,137,.75); }
.podlabel{ font-family:var(--font-mono); font-size:4.6px; letter-spacing:.3em; fill:rgba(232,196,137,.5); }

/* the tower shell */
.tower .crown{ fill:#443B60; stroke:rgba(232,196,137,.25); stroke-width:.5; }
.crownmark{ font-family:var(--font-brand); font-size:7px; letter-spacing:.14em; fill:rgba(243,240,247,.85); }

/* balcony bands, lit warm like the render */
.band path{ fill:rgba(255,255,255,.055); }
.band{ animation:bandIn .5s var(--ease) both; animation-delay:var(--d); }
@keyframes bandIn{ from{ opacity:0; transform:translateY(8px) } to{ opacity:1; transform:none } }
.band.lit path{
  fill:rgba(232,196,137,.55);
  filter:drop-shadow(0 0 3px rgba(232,196,137,.6));
}
.band.lit{ animation:bandIn .5s var(--ease) both, warm 6s ease-in-out infinite; }
@keyframes warm{ 0%,100%{ opacity:1 } 50%{ opacity:.78 } }

/* live lamps */
.lamp{ cursor:pointer; animation:lampPulse 2.8s ease-in-out infinite; }
.lamp.quiet{  fill:#6FCF97; }
.lamp.steady{ fill:#8F66F4; }
.lamp.busy{   fill:#E8C489; }
@keyframes lampPulse{ 0%,100%{ opacity:.5; r:4 } 50%{ opacity:1; r:5.6 } }
.lamps circle:nth-child(2){ animation-delay:.55s }
.lamps circle:nth-child(3){ animation-delay:1.1s }
.lamps circle:nth-child(4){ animation-delay:1.65s }
.lamps circle:nth-child(5){ animation-delay:2.2s }

/* the drone doing its round */
.dronefly{ animation:droneRun 12s linear infinite; }
.dtext{ font-size:11px; }
@keyframes droneRun{
  0%   { transform:translate(278px, 104px); opacity:0 }
  8%   { opacity:1 }
  46%  { transform:translate(168px, 150px); opacity:1 }
  58%  { transform:translate(154px, 186px); opacity:1 }
  72%  { transform:translate(154px, 186px); opacity:1 }
  92%  { transform:translate(278px, 104px); opacity:1 }
  100% { transform:translate(278px, 104px); opacity:0 }
}

/* key */
.bkey{
  display:flex; gap:13px; justify-content:center; flex-wrap:wrap; padding:8px 10px 4px;
  font-family:var(--font-mono); font-size:8px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--grey-2);
}
.bkey span{ display:flex; align-items:center; gap:6px; }
.bkey .k{ width:7px; height:7px; border-radius:50%; display:block; }
.bkey .k.quiet{ background:#6FCF97 } .bkey .k.steady{ background:#8F66F4 }
.bkey .k.busy{ background:#E8C489 } .bkey .k.home{ background:rgba(232,196,137,.55) }

/* zone tiles */
.zonegrid{ display:grid; grid-template-columns:1fr 1fr; gap:9px; }
.zone{
  text-align:left; padding:14px 13px 13px; border-radius:var(--r-md);
  border:1px solid var(--line); background:var(--surface);
  display:flex; flex-direction:column; gap:5px;
  transition:border-color .2s var(--ease), transform .18s var(--ease);
}
.zone:active{ transform:scale(.98); }
.zone-emo{ font-size:19px; line-height:1; }
.zone-name{ font-size:13px; font-weight:600; letter-spacing:-.01em; }
.zone-num{ font-family:var(--font-mono); font-size:11px; color:var(--grey); }
.zone-bar{ height:3px; border-radius:100px; background:rgba(255,255,255,.09); overflow:hidden; margin-top:3px; }
.zone-bar i{ display:block; height:100%; transition:width .9s var(--ease); background:#6FCF97; }
.zone.steady .zone-bar i{ background:#8F66F4; }
.zone.busy   .zone-bar i{ background:#E8C489; }
.zone.busy{ border-color:var(--gold-line); }

@media (prefers-reduced-motion:reduce){
  .dronefly,.lamp,.band.lit,.pool{ animation:none !important; }
}

/* ================= ONE Residence · live model (dusk) ================= */
.bworld{
  position:relative; margin:0 var(--pad); padding:0; overflow:hidden;
  border:1px solid var(--line); border-radius:var(--r-lg);
  background:#141129; cursor:grab; touch-action:pan-y;
}
.bworld:active{ cursor:grabbing; }
.bstage{ transition:transform .12s linear; will-change:transform; }
.bsvg{ width:100%; height:340px; display:block; }

.stars circle{ fill:#fff; opacity:.5; animation:twinkle 3.4s ease-in-out infinite; }
.stars circle:nth-child(2n){ animation-delay:1s }
.skyline rect{ fill:#1A1630; opacity:.9; }
.halo{ opacity:.7; }

/* the tower */
.tower .cap{ fill:#D8D0E4; }
.crownmark{ font-family:var(--font-brand); font-size:8px; letter-spacing:.14em; fill:rgba(243,240,247,.9); }
.wins .win{ fill:rgba(232,196,137,.30); animation:winOn .5s var(--ease) both; animation-delay:var(--w); }
@keyframes winOn{ from{ opacity:0 } to{ opacity:1 } }

/* curved balconies, warm where somebody is home */
.bal path{ fill:rgba(255,255,255,.055); }
.bal{ animation:balIn .45s var(--ease) both; animation-delay:var(--d); }
@keyframes balIn{ from{ opacity:0; transform:translateY(9px) } to{ opacity:1; transform:none } }
.bal.lit path{ fill:rgba(232,196,137,.6); filter:drop-shadow(0 0 4px rgba(232,196,137,.55)); }
.bal.lit{ animation:balIn .45s var(--ease) both, warmth 7s ease-in-out infinite; }
@keyframes warmth{ 0%,100%{ opacity:1 } 50%{ opacity:.8 } }

/* podium */
.podium .pk{  fill:#221C36; } .podium .pk2{ fill:#2A2340; }
.podium .deck{ stroke:rgba(232,196,137,.2); stroke-width:.6; }
.pool{ fill:rgba(120,195,225,.55); stroke:rgba(190,230,250,.55); stroke-width:.6; cursor:pointer;
       animation:shimmer 4.5s ease-in-out infinite; }
@keyframes shimmer{ 0%,100%{ opacity:.6 } 50%{ opacity:.95 } }
.court{ fill:rgba(120,205,155,.34); stroke:rgba(165,230,190,.45); stroke-width:.6; cursor:pointer; }
.helipad{ fill:none; stroke:rgba(232,196,137,.6); stroke-width:1; }
.heliH{ font-family:var(--font-mono); font-size:5px; fill:rgba(232,196,137,.8); }
.heli{ font-size:9px; animation:heliIdle 5s ease-in-out infinite; }
@keyframes heliIdle{ 0%,100%{ opacity:.85 } 50%{ opacity:1 } }
.palm{ font-size:9px; opacity:.55; } .palm.sm{ font-size:7px; opacity:.4; }
.podlabel{ font-family:var(--font-mono); font-size:4.4px; letter-spacing:.3em; fill:rgba(232,196,137,.55); }

/* live lamps */
.lamp{ cursor:pointer; animation:lampPulse 2.8s ease-in-out infinite; }
.lamp.quiet{ fill:#6FCF97 } .lamp.steady{ fill:#8F66F4 } .lamp.busy{ fill:#E8C489 }
@keyframes lampPulse{ 0%,100%{ opacity:.5; r:3.8 } 50%{ opacity:1; r:5.4 } }
.lamps circle:nth-child(2){ animation-delay:.55s } .lamps circle:nth-child(3){ animation-delay:1.1s }
.lamps circle:nth-child(4){ animation-delay:1.65s } .lamps circle:nth-child(5){ animation-delay:2.2s }

/* delivery drone */
.dronefly{ animation:droneRun 13s linear infinite; }
.dtext{ font-size:10px; }
@keyframes droneRun{

.bkey{

/* zone tiles */

.zone{

}

/* ================= what ONE is building ================= */

}

}

@media (prefers-reduced-motion:reduce){

/* ================= tab bar in ONE violet ================= */

/* ================= coming home ================= */
.arrivehero{
  padding:30px 24px 26px; border-radius:var(--r-lg); text-align:center;
  border:1px solid var(--line); background:var(--surface);
  transition:border-color .4s var(--ease), background .4s var(--ease);
}
.arrivehero.live{
  border-color:var(--brand-line);
  background:linear-gradient(160deg, var(--brand-soft), var(--surface) 66%);
}
.arrive-rings{ position:relative; width:96px; height:96px; margin:0 auto 20px; }
.arrive-rings i{
  position:absolute; inset:0; border-radius:50%;

}
.arrivehero.live .arrive-rings i{ animation:ripple 2.6s var(--ease) infinite; }
.arrivehero.live .arrive-rings i:nth-child(2){ animation-delay:.85s }

@keyframes ripple{ 0%{ transform:scale(.42); opacity:0 } 20%{ opacity:1 } 100%{ transform:scale(1); opacity:0 } }

}

}

}

.motor-split b{ display:block; font-family:var(--font-brand); font-size:24px; line-height:1; }
.motor-split span{
  display:block; margin-top:6px; font-family:var(--font-mono); font-size:7.5px;
  letter-spacing:.16em; text-transform:uppercase; color:var(--grey-2);
}
.motorseg{ border-radius:100px; }
.motorseg .seg-opt{ border-radius:100px; }

/* the cards */
.carwrap{ display:flex; flex-direction:column; gap:18px; }
.carcard{
  position:relative; border-radius:20px; overflow:hidden;
  border:1px solid var(--line); background:var(--surface);
  transition:transform .3s var(--ease), border-color .3s var(--ease);
  animation:cardIn .5s var(--ease) both;
}
.carcard:active{ transform:scale(.99); }
.car-glow{
  position:absolute; inset:0; pointer-events:none; opacity:.9;
  background:radial-gradient(90% 70% at 78% 0%, rgba(183,155,255,.18), transparent 62%);
}
.tone-a .car-glow{ background:radial-gradient(90% 70% at 78% 0%, rgba(143,102,244,.22), transparent 62%); }
.tone-b .car-glow{ background:radial-gradient(90% 70% at 78% 0%, rgba(120,190,225,.18), transparent 62%); }
.tone-c .car-glow{ background:radial-gradient(90% 70% at 78% 0%, rgba(214,150,220,.18), transparent 62%); }
.tone-d .car-glow{ background:radial-gradient(90% 70% at 78% 0%, rgba(140,205,170,.16), transparent 62%); }

.car-head{
  position:relative; height:104px; display:flex; align-items:center; justify-content:space-between;
  padding:0 22px;
}
.car-emo{
  font-size:52px; line-height:1;
  filter:drop-shadow(0 10px 18px rgba(0,0,0,.4));
  animation:carFloat 5.5s ease-in-out infinite;
}
@keyframes carFloat{ 0%,100%{ transform:translateY(0) } 50%{ transform:translateY(-5px) } }
.car-badge{
  font-family:var(--font-mono); font-size:8px; letter-spacing:.18em; text-transform:uppercase;
  padding:6px 11px; border-radius:100px; border:1px solid var(--brand-line);
  background:rgba(13,11,20,.4); color:#D9CDF6; backdrop-filter:blur(6px);
}
.car-badge.rent{ border-color:rgba(120,190,225,.45); color:#BFE0F2; }
.car-badge.both{ border-color:rgba(140,205,170,.45); color:#C4E8D4; }

.car-body{ position:relative; padding:4px 22px 22px; }
.car-name{ font-family:var(--font-brand); font-size:24px; letter-spacing:-.01em; }
.car-meta{ font-family:var(--font-mono); font-size:10px; letter-spacing:.1em; color:var(--grey-2); margin-top:7px; text-transform:uppercase; }
.car-price{ display:flex; align-items:baseline; gap:9px; flex-wrap:wrap; margin-top:14px; }
.car-price b{ font-family:var(--font-brand); font-size:28px; color:#B79BFF; line-height:1; }
.car-price span{ font-family:var(--font-mono); font-size:10px; letter-spacing:.14em; color:var(--grey); text-transform:uppercase; }
.car-price em{
  font-style:normal; font-family:var(--font-mono); font-size:10px; letter-spacing:.1em;
  color:var(--grey-2); padding:4px 9px; border-radius:100px; border:1px solid var(--line);
}
.car-why{ color:var(--grey); font-size:13.5px; line-height:1.6; margin-top:14px; }
.carlog{
  display:flex; gap:10px; align-items:center; margin-top:16px; padding:12px 14px;
  border-radius:12px; background:rgba(183,155,255,.08); border:1px solid var(--brand-line);
  font-size:12.5px; color:#D9CDF6;
}
.carlog svg{ width:15px; height:15px; flex:0 0 15px; color:#B79BFF; }
.carlog b{ color:var(--white); }
.motorcard{ border-color:var(--brand-line); background:linear-gradient(160deg, var(--brand-soft), var(--surface) 64%); }

    if (m.role === "typing") return '<div class="msg ai tint"><span class="dots"><i></i><i></i><i></i></span></div>';
    let out = '<div class="msg ai tint">' + esc(m.text) + "</div>";
    if (m.card) {
      const mm = MATCHES.find((x) => x.id === m.card);
      if (mm) {

        out += '<div class="card msg-card"><div class="card-eyebrow"><i class="tick"></i>' + mm.kind.toUpperCase() + " · " + mm.when.toUpperCase() + "</div>" +

      }
    }
    return out;
  }

  function aiAsk(text) {
    if (!text.trim() || S.aiBusy) return;
    S.aiBusy = true;
    S.aiThread.push({ role: "me", text: text });
    S.aiThread.push({ role: "typing" });
    render();
    scrollThread();
    setTimeout(() => {
      S.aiThread.pop();
      const low = " " + text.toLowerCase().trim() + " ";
      const chat = AI_CHAT.find((x) => x.k.some((w) => low.includes(w)));
      const hit = AI_REPLIES.find((x) => x.k.some((w) => low.includes(w)));
      let out;
      if (chat && !hit) out = { role: "ai", text: chat.t[Math.floor(Math.random() * chat.t.length)] };
      else if (hit) out = { role: "ai", text: typeof hit.t === "function" ? hit.t() : hit.t, card: hit.card };
      else out = { role: "ai", text: "I am not certain about that one. I know this building well though, so try me on your package, the gym, a maintenance issue, booking an amenity, a visitor pass or what is happening tonight." };
      S.aiThread.push(out);
      S.aiBusy = false;
      render();
      scrollThread();
    }, 1150);
  }
