<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, interactive-widget=resizes-content" />
<meta name="theme-color" content="#9E69FF" />

<!-- home screen icon (iPhone: Share > Add to Home Screen) -->
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-180.png" />
<link rel="manifest" href="manifest.json" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="ONE Life" />
<meta name="mobile-web-app-capable" content="yes" />

<!-- link preview on WhatsApp / email / LinkedIn -->
<meta property="og:type" content="website" />
<meta property="og:title" content="ONE Life" />
<meta property="og:description" content="Your community. Connected. A private, verified resident network." />
<meta property="og:image" content="og-image.png" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:image" content="og-image.png" />
<title>ONE Life — Your community. Connected.</title>
<meta name="description" content="ONE Life — a private, verified resident network for premium residential communities." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500&family=Jost:wght@200;300;400;500&family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ============================================================
   ONE Life — visual system
   Palette : ONE brand purple #9E69FF / white / deep aubergine ink
   Type    : Jost (brand + display) · Manrope (UI) · Plex Mono (data)
   Signature: concentric "ONE" rings = resident ↔ community ↔ management
   ============================================================ */

:root{
  /* ONE brand */
  --brand:      #9E69FF;   /* sampled from the ONE Development mark */
  --brand-deep: #6F3FD6;
  --brand-soft: rgba(158,105,255,.16);
  --brand-line: rgba(158,105,255,.38);
  --ai:         #C9AEFF;   /* lighter lavender, ONE AI only */
  --ai-soft:    rgba(201,174,255,.14);

  /* neutrals, tinted toward the brand */
  --ink:        #0A0616;
  --ink-2:      #0E0920;
  --surface:    #17102B;
  --surface-2:  #1F1739;
  --line:       rgba(255,255,255,.085);
  --line-2:     rgba(255,255,255,.16);
  --white:      #F7F4FF;
  --grey:       #9A93B0;
  --grey-2:     #6B6488;
  --green:      #6FCF97;

  --r-lg: 22px;
  --r-md: 16px;
  --r-sm: 11px;

  --pad: 20px;
  --ease: cubic-bezier(.22,.85,.3,1);
  --font-brand: "Bodoni Moda", Georgia, serif;
  --font-ui: "Manrope", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-display: "Jost", "Manrope", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, monospace;
}

*{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }

html,body{ height:100%; }
body{
  background:var(--ink);
  color:var(--white);
  font-family:var(--font-ui);
  font-size:15px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}
button{ font:inherit; color:inherit; background:none; border:0; cursor:pointer; }
input,textarea,select{ font:inherit; color:inherit; }
img{ display:block; max-width:100%; }

/* ---------- ambience (desktop only) ---------- */
.ambience{ position:fixed; inset:0; overflow:hidden; pointer-events:none; }
.orb{ position:absolute; border-radius:50%; filter:blur(90px); opacity:.5; }
.orb-a{ width:520px; height:520px; left:-140px; top:-120px; background:radial-gradient(circle,rgba(158,105,255,.30),transparent 70%); }
.orb-b{ width:620px; height:620px; right:-200px; bottom:-220px; background:radial-gradient(circle,rgba(111,63,214,.30),transparent 70%); }

/* ---------- device shell ---------- */
.stage{ position:relative; display:flex; flex-direction:column; align-items:center; gap:14px; }
.device{
  position:relative;
  width:400px; height:min(844px, 92vh);
  background:var(--ink-2);
  border:1px solid rgba(255,255,255,.10);
  border-radius:46px;
  overflow:hidden;
  display:flex; flex-direction:column;
  box-shadow:0 40px 120px -20px rgba(0,0,0,.9), 0 0 0 10px rgba(255,255,255,.02);
}
.stage-note{ font-family:var(--font-mono); font-size:10.5px; letter-spacing:.16em; text-transform:uppercase; color:var(--grey-2); }

/* ---------- splash : the ONE LIFE mark ---------- */
.splash{
  position:absolute; inset:0; z-index:60;
  background:radial-gradient(125% 95% at 50% 32%, #B489FF 0%, #9E69FF 48%, #7B4AE8 100%);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  transition:opacity .7s var(--ease), transform .7s var(--ease);
}
.splash.out{ opacity:0; transform:scale(1.04); pointer-events:none; }
.splash-inner{ position:relative; display:grid; place-items:center; }

/* ring motif sits behind the mark as a watermark */
.rings{
  position:absolute; width:296px; height:296px; opacity:.34; pointer-events:none;
  animation:rise 1.2s var(--ease) both;
}
.ring{ fill:none; stroke:rgba(255,255,255,.75); stroke-width:1; transform-origin:110px 110px; }
.ring.r1{ stroke-dasharray:120 495; animation:spin 5.5s linear infinite; }
.ring.r2{ stroke-dasharray:80 385; animation:spin 4s linear infinite reverse; }
.ring.r3{ stroke-dasharray:60 254; animation:spin 3s linear infinite; }
.core{ fill:#fff; animation:pulse 2.4s var(--ease) infinite; }
@keyframes spin{ to{ transform:rotate(360deg); } }
@keyframes pulse{ 0%,100%{ opacity:.4; r:4 } 50%{ opacity:1; r:6 } }

/* ONE over LIFE, LIFE locked to the bottom right */
.wordmark{
  position:relative; text-align:right; color:#fff;
  opacity:0; animation:rise 1s var(--ease) .3s forwards;
}
.wm-one{
  display:block; font-family:var(--font-brand); font-weight:400;
  font-size:76px; line-height:.84; letter-spacing:.045em; margin-right:-.045em;
}
.wm-life{
  display:block; font-family:var(--font-display); font-weight:200;
  font-size:19px; letter-spacing:.46em; margin-right:-.46em; margin-top:9px;
}
.splash-tag{ margin-top:26px; color:rgba(255,255,255,.88); font-size:13px; letter-spacing:.03em; opacity:0; animation:rise .9s var(--ease) .75s forwards; }
.splash-bar{ margin-top:30px; width:110px; height:1px; background:rgba(255,255,255,.3); overflow:hidden; opacity:0; animation:rise .5s var(--ease) 1s forwards; }
.splash-bar i{ display:block; height:100%; width:0; background:#fff; animation:load 1.6s var(--ease) 1.1s forwards; }
@keyframes load{ to{ width:100% } }
.splash-foot{
  position:absolute; bottom:38px; font-family:var(--font-mono); font-size:10px;
  letter-spacing:.2em; text-transform:uppercase; color:rgba(255,255,255,.62);
  opacity:0; animation:rise .9s var(--ease) 1.4s forwards;
}
@keyframes rise{ from{ opacity:0; transform:translateY(10px) } to{ opacity:1; transform:none } }

/* the same lockup, small, for in-app brand moments */
.mark{ text-align:right; display:inline-block; color:var(--white); }
.mark b{ display:block; font-family:var(--font-brand); font-weight:400; font-size:34px; line-height:.85; letter-spacing:.045em; margin-right:-.045em; }
.mark span{ display:block; font-family:var(--font-display); font-weight:200; font-size:9px; letter-spacing:.44em; margin-right:-.44em; margin-top:5px; }

/* ---------- scrolling view ---------- */
.view{
  flex:1; overflow-y:auto; overflow-x:hidden;
  scrollbar-width:none; outline:none;
  padding-bottom:104px;
}
.device.has-composer .view{ padding-bottom:16px; }
.view::-webkit-scrollbar{ display:none; }
.page{ animation:pageIn .42s var(--ease) both; }
.page.push{ animation:pushIn .38s var(--ease) both; }
@keyframes pageIn{ from{ opacity:0; transform:translateY(12px) } to{ opacity:1; transform:none } }
@keyframes pushIn{ from{ opacity:0; transform:translateX(26px) } to{ opacity:1; transform:none } }

/* ---------- top bars ---------- */
.topbar{
  position:static; z-index:20;
  padding:calc(env(safe-area-inset-top) + 20px) var(--pad) 12px;
  background:linear-gradient(to bottom, var(--ink-2) 62%, rgba(11,14,21,0));
  display:flex; align-items:flex-end; justify-content:space-between; gap:12px;
}
.topbar.solid{ background:var(--ink-2); border-bottom:1px solid var(--line); padding-bottom:14px; }
.eyebrow{
  font-family:var(--font-mono); font-size:9.5px; letter-spacing:.22em;
  text-transform:uppercase; color:var(--grey-2);
}
.greeting{ font-family:var(--font-display); font-weight:300; font-size:25px; letter-spacing:.01em; margin-top:5px; }
.greeting b{ font-weight:400; color:var(--white); }
.page-title{ font-family:var(--font-display); font-weight:300; font-size:29px; letter-spacing:.01em; margin-top:6px; }
.page-sub{ color:var(--grey); font-size:13px; margin-top:6px; }

.icon-btn{
  width:38px; height:38px; flex:0 0 38px; border-radius:50%;
  border:1px solid var(--line); background:var(--surface);
  display:grid; place-items:center; position:relative;
  transition:transform .18s var(--ease), border-color .2s;
}
.icon-btn:active{ transform:scale(.92); }
.icon-btn svg{ width:17px; height:17px; }
.icon-btn .dot{ position:absolute; top:8px; right:9px; width:6px; height:6px; border-radius:50%; background:var(--brand); box-shadow:0 0 0 3px var(--surface); }
.bar-actions{ display:flex; gap:8px; align-items:center; }

/* ---------- generic layout ---------- */
.section{ padding:6px var(--pad) 0; }
.section + .section{ margin-top:22px; }
.section-head{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:11px; }
.section-head h2{ font-size:12px; font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:var(--grey); }
.link{ font-size:12px; color:var(--brand); letter-spacing:.02em; }
.stack{ display:flex; flex-direction:column; gap:11px; }

/* staggered entrance */
[data-anim]{ animation:cardIn .5s var(--ease) both; }
@keyframes cardIn{ from{ opacity:0; transform:translateY(14px) } to{ opacity:1; transform:none } }

/* ---------- signals (live status strip) ---------- */
.signals{ display:flex; gap:9px; overflow-x:auto; padding:2px var(--pad) 4px; scrollbar-width:none; }
.signals::-webkit-scrollbar{ display:none; }
.signal{
  flex:0 0 152px; padding:13px 14px 14px; border-radius:var(--r-md);
  background:var(--surface); border:1px solid var(--line);
  display:flex; flex-direction:column; gap:5px; text-align:left;
  transition:transform .2s var(--ease), border-color .2s;
}
.signal:active{ transform:scale(.97); }
.signal .sig-top{ display:flex; align-items:center; gap:7px; color:var(--grey-2); }
.signal .sig-top svg{ width:14px; height:14px; }
.signal .sig-label{ font-family:var(--font-mono); font-size:9px; letter-spacing:.16em; text-transform:uppercase; }
.signal .sig-value{ font-size:13.5px; font-weight:600; letter-spacing:-.01em; }
.signal .sig-note{ font-size:11.5px; color:var(--grey); }
.signal.is-live{ border-color:var(--brand-line); background:linear-gradient(160deg,var(--brand-soft),var(--surface) 60%); }
.signal.is-live .sig-top{ color:var(--brand); }

.live-dot{ width:5px; height:5px; border-radius:50%; background:var(--green); display:inline-block; animation:blink 2s ease-in-out infinite; }
@keyframes blink{ 0%,100%{ opacity:1 } 50%{ opacity:.25 } }

/* ---------- cards ---------- */
.card{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg);
  padding:16px; position:relative; overflow:hidden;
}
.card.tap{ transition:transform .2s var(--ease), background .2s; }
.card.tap:active{ transform:scale(.985); background:var(--surface-2); }
.card-eyebrow{
  display:flex; align-items:center; gap:7px; margin-bottom:9px;
  font-family:var(--font-mono); font-size:9.5px; letter-spacing:.2em;
  text-transform:uppercase; color:var(--grey-2);
}
.card-eyebrow .tick{ width:14px; height:1px; background:var(--brand); }
.card-title{ font-family:var(--font-display); font-weight:400; font-size:20px; letter-spacing:.005em; }
.card-title.sm{ font-size:17px; }
.card-body{ color:var(--grey); font-size:13.5px; margin-top:7px; }
.card-actions{ display:flex; gap:8px; margin-top:14px; align-items:center; }

.meta-row{ display:flex; flex-wrap:wrap; gap:6px; margin-top:12px; }
.chip{
  font-family:var(--font-mono); font-size:9.5px; letter-spacing:.12em; text-transform:uppercase;
  padding:5px 9px; border-radius:100px; border:1px solid var(--line);
  color:var(--grey); background:rgba(255,255,255,.02);
}
.chip.accent{ color:var(--brand); border-color:var(--brand-line); background:var(--brand-soft); }

/* people row */
.people{ display:flex; align-items:center; gap:10px; margin-top:13px; }
.avatars{ display:flex; }
.avatars .av{ margin-left:-9px; border:2px solid var(--surface); }
.avatars .av:first-child{ margin-left:0; }
.av{
  width:30px; height:30px; border-radius:50%; flex:0 0 auto;
  display:grid; place-items:center; font-size:11px; font-weight:700; letter-spacing:.02em;
  color:#180B33; background:linear-gradient(150deg,#CDB0FF,#8A5CF0);
}
.av.lg{ width:56px; height:56px; font-size:18px; }
.av.md{ width:38px; height:38px; font-size:13px; }
.av.v2{ background:linear-gradient(150deg,#E7DCFF,#A98BEA); }
.av.v3{ background:linear-gradient(150deg,#B490FF,#6F3FD6); }
.av.v4{ background:linear-gradient(150deg,#DCD2F7,#8E82C6); }
.people-txt{ font-size:12.5px; color:var(--grey); }

.verified{ display:inline-flex; align-items:center; gap:4px; color:var(--brand); font-size:11.5px; white-space:nowrap; }
.verified svg{ width:12px; height:12px; }

/* ---------- buttons ---------- */
.btn{
  height:38px; padding:0 17px; border-radius:100px;
  border:1px solid var(--line-2); background:rgba(255,255,255,.04);
  font-size:13px; font-weight:600; letter-spacing:.01em;
  display:inline-flex; align-items:center; justify-content:center; gap:7px;
  transition:transform .16s var(--ease), background .2s, border-color .2s, color .2s;
}
.btn:active{ transform:scale(.95); }
.btn svg{ width:14px; height:14px; }
.btn-accent{ background:var(--brand); border-color:var(--brand); color:#FFFFFF; }
.btn-ghost{ background:transparent; border-color:var(--line-2); color:var(--grey); }
.btn-block{ width:100%; height:48px; font-size:14px; }
.btn-ai{ background:var(--ai); border-color:var(--ai); color:#1B0E38; }
.btn.is-done{
  background:transparent; border-color:rgba(111,207,151,.45); color:var(--green);
  animation:pop .4s var(--ease);
}
@keyframes pop{ 0%{ transform:scale(.9) } 55%{ transform:scale(1.05) } 100%{ transform:scale(1) } }
.btn.is-saved{ color:var(--brand); border-color:var(--brand-line); }

/* ---------- tabs ---------- */
.tabs{ display:flex; gap:7px; overflow-x:auto; padding:4px var(--pad) 14px; scrollbar-width:none; background:var(--ink-2); }
.tabs::-webkit-scrollbar{ display:none; }
.tab{
  flex:0 0 auto; padding:8px 14px; border-radius:100px; font-size:12.5px; font-weight:600;
  color:var(--grey); border:1px solid var(--line); transition:all .22s var(--ease);
}
.tab.on{ color:#0A0C11; background:var(--white); border-color:var(--white); }

/* interest chips */
.interests{ display:flex; flex-wrap:wrap; gap:8px; }
.int{
  padding:9px 14px; border-radius:100px; border:1px solid var(--line);
  background:var(--surface); font-size:13px; color:var(--grey);
  display:inline-flex; align-items:center; gap:7px; transition:all .22s var(--ease);
}
.int.on{ color:var(--white); border-color:var(--brand-line); background:var(--brand-soft); }
.int:active{ transform:scale(.95); }

/* ---------- marketplace ---------- */
.grid{ display:grid; grid-template-columns:1fr 1fr; gap:11px; padding:0 var(--pad); }
.tile{ text-align:left; border-radius:var(--r-md); overflow:hidden; border:1px solid var(--line); background:var(--surface); transition:transform .2s var(--ease); }
.tile:active{ transform:scale(.97); }
.thumb{
  aspect-ratio:1/1; display:grid; place-items:center; position:relative;
  background:linear-gradient(150deg,#2A1D4D,#120C24);
}
.thumb::after{ content:""; position:absolute; inset:0; background:radial-gradient(70% 60% at 30% 20%, rgba(255,255,255,.07), transparent 70%); }
.thumb span{ font-size:34px; filter:grayscale(.25) opacity(.9); }
.thumb.free::before{
  content:"FREE"; position:absolute; top:9px; left:9px; z-index:2;
  font-family:var(--font-mono); font-size:8.5px; letter-spacing:.16em;
  padding:4px 7px; border-radius:100px; background:var(--brand); color:#fff;
}
.tile-body{ padding:11px 12px 13px; }
.tile-name{ font-size:13.5px; font-weight:600; letter-spacing:-.01em; }
.tile-price{ font-family:var(--font-mono); font-size:12px; color:var(--brand); margin-top:4px; }
.tile-meta{ font-size:11px; color:var(--grey-2); margin-top:6px; display:flex; align-items:center; gap:5px; }

.hero-thumb{ aspect-ratio:4/3; display:grid; place-items:center; background:linear-gradient(150deg,#2E2055,#110B22); border-radius:var(--r-lg); border:1px solid var(--line); position:relative; overflow:hidden; }
.hero-thumb span{ font-size:64px; }

/* ---------- list rows ---------- */
.rows{ border-radius:var(--r-lg); border:1px solid var(--line); background:var(--surface); overflow:hidden; }
.row{
  width:100%; display:flex; align-items:center; gap:12px; padding:14px 15px;
  border-bottom:1px solid var(--line); text-align:left; transition:background .18s;
}
.row:last-child{ border-bottom:0; }
.row:active{ background:var(--surface-2); }
.row-ico{ width:32px; height:32px; flex:0 0 32px; border-radius:10px; background:rgba(255,255,255,.045); display:grid; place-items:center; color:var(--grey); }
.row-ico svg{ width:15px; height:15px; }
.row-main{ flex:1; min-width:0; }
.row-title{ font-size:14px; font-weight:600; }
.row-sub{ font-size:12px; color:var(--grey); margin-top:2px; }
.row-right{ color:var(--grey-2); display:flex; align-items:center; gap:8px; font-size:12px; }
.row-right svg{ width:15px; height:15px; }

/* toggle */
.tog{ width:44px; height:26px; flex:0 0 44px; border-radius:100px; background:rgba(255,255,255,.10); position:relative; transition:background .25s var(--ease); }
.tog i{ position:absolute; top:3px; left:3px; width:20px; height:20px; border-radius:50%; background:var(--white); transition:transform .25s var(--ease); }
.tog.on{ background:var(--brand); }
.tog.on i{ transform:translateX(18px); background:#FFFFFF; }

/* ---------- notifications ---------- */
.note{ display:flex; gap:12px; padding:14px 0; border-bottom:1px solid var(--line); }
.note:last-child{ border-bottom:0; }
.note-dot{ width:7px; height:7px; border-radius:50%; background:var(--brand); margin-top:7px; flex:0 0 7px; }
.note-dot.read{ background:var(--line-2); }
.note-title{ font-size:14px; font-weight:600; }
.note-sub{ font-size:12.5px; color:var(--grey); margin-top:3px; }
.note-time{ font-family:var(--font-mono); font-size:9.5px; letter-spacing:.14em; color:var(--grey-2); margin-top:6px; text-transform:uppercase; }

/* ---------- AI ---------- */
.ai-head{ padding:calc(env(safe-area-inset-top) + 22px) var(--pad) 4px; text-align:center; }
.ai-orb{ width:74px; height:74px; margin:0 auto 14px; position:relative; }
.ai-orb svg{ width:100%; height:100%; }
.ai-orb .ring{ stroke:rgba(201,174,255,.5); transform-origin:50% 50%; }
.ai-orb .ring.a{ stroke-dasharray:70 300; animation:spin 6s linear infinite; }
.ai-orb .ring.b{ stroke-dasharray:40 200; animation:spin 4s linear infinite reverse; }
.ai-orb .core{ fill:var(--ai); }
.thread{ padding:14px var(--pad) 0; display:flex; flex-direction:column; gap:12px; }
.msg{ max-width:84%; padding:12px 15px; border-radius:18px; font-size:14px; line-height:1.5; animation:cardIn .4s var(--ease) both; }
.msg.me{ align-self:flex-end; background:var(--white); color:#0A0C11; border-bottom-right-radius:6px; font-weight:500; }
.msg.ai{ align-self:flex-start; background:var(--surface); border:1px solid var(--line); border-bottom-left-radius:6px; }
.msg.ai.tint{ border-color:rgba(201,174,255,.28); background:linear-gradient(160deg,var(--ai-soft),var(--surface) 70%); }
.msg-card{ align-self:flex-start; width:88%; animation:cardIn .4s var(--ease) both; }
.dots{ display:inline-flex; gap:4px; align-items:center; height:14px; }
.dots i{ width:5px; height:5px; border-radius:50%; background:var(--ai); opacity:.4; animation:bob 1.1s ease-in-out infinite; }
.dots i:nth-child(2){ animation-delay:.15s } .dots i:nth-child(3){ animation-delay:.3s }
@keyframes bob{ 0%,100%{ transform:translateY(0); opacity:.35 } 50%{ transform:translateY(-4px); opacity:1 } }
.suggests{ display:flex; flex-direction:column; gap:8px; padding:16px var(--pad) 0; }
.sugg{
  text-align:left; padding:13px 15px; border-radius:14px; font-size:13.5px;
  border:1px solid var(--line); background:var(--surface); color:var(--white);
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  transition:transform .18s var(--ease), border-color .2s;
}
.sugg:active{ transform:scale(.98); }
.sugg svg{ width:14px; height:14px; color:var(--grey-2); flex:0 0 14px; }

/* composer */
.composer{
  padding:10px var(--pad); display:flex; gap:9px; align-items:center;
  background:rgba(14,9,32,.94);
  backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
  border-top:1px solid var(--line);
}
.composer input{
  flex:1; height:44px; border-radius:100px; padding:0 17px;
  background:var(--surface); border:1px solid var(--line); outline:none; font-size:14px;
}
.composer input::placeholder{ color:var(--grey-2); }
.composer input:focus{ border-color:var(--line-2); }
.send{ width:44px; height:44px; flex:0 0 44px; border-radius:50%; background:var(--brand); color:#FFFFFF; display:grid; place-items:center; }
.send svg{ width:17px; height:17px; }

/* ---------- profile ---------- */
.profile-head{ padding:8px var(--pad) 0; display:flex; align-items:center; gap:14px; }
.p-name{ font-family:var(--font-display); font-weight:400; font-size:23px; }
.stats{ display:flex; gap:9px; padding:18px var(--pad) 0; }
.stat{ flex:1; padding:13px 12px; border-radius:var(--r-md); background:var(--surface); border:1px solid var(--line); }
.stat b{ font-family:var(--font-display); font-weight:400; font-size:21px; display:block; }
.stat span{ font-family:var(--font-mono); font-size:8.5px; letter-spacing:.16em; text-transform:uppercase; color:var(--grey-2); }

.privacy-note{
  margin:0 var(--pad); padding:14px 15px; border-radius:var(--r-md);
  background:var(--brand-soft); border:1px solid var(--brand-line);
  font-size:12.5px; color:#DCCDFF; display:flex; gap:10px; align-items:flex-start;
}
.privacy-note svg{ width:15px; height:15px; flex:0 0 15px; color:var(--brand); margin-top:1px; }

/* ---------- concept diagram ---------- */
.concept{ padding:0 var(--pad); }
.diagram{ width:100%; height:250px; }
.diagram text{ font-family:var(--font-mono); font-size:8px; letter-spacing:.18em; fill:var(--grey); text-transform:uppercase; }
.diagram .node{ fill:var(--surface); stroke:var(--line-2); }
.diagram .node.me{ fill:var(--brand); stroke:var(--brand); }
.diagram .conn{ stroke:var(--brand-line); stroke-width:1; stroke-dasharray:3 4; animation:dash 14s linear infinite; }
.diagram .halo{ fill:none; stroke:var(--line); }
@keyframes dash{ to{ stroke-dashoffset:-140 } }
.compare{ display:flex; flex-direction:column; gap:10px; margin-top:6px; }
.compare div{ padding:14px 15px; border-radius:var(--r-md); border:1px solid var(--line); background:var(--surface); }
.compare .lbl{ font-family:var(--font-mono); font-size:9px; letter-spacing:.2em; text-transform:uppercase; color:var(--grey-2); margin-bottom:7px; }
.compare .flow{ font-family:var(--font-display); font-size:15px; font-weight:300; letter-spacing:.04em; color:var(--grey); }
.compare .flow.accent{ color:var(--brand); }

/* ---------- tab bar ---------- */
.tabbar{
  position:absolute; left:0; right:0; bottom:0; z-index:30;
  height:calc(70px + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom);
  display:flex; align-items:center;
  background:rgba(9,11,17,.82);
  backdrop-filter:blur(22px) saturate(150%);
  -webkit-backdrop-filter:blur(22px) saturate(150%);
  border-top:1px solid var(--line);
}
.tabbtn{
  flex:1; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px;
  color:var(--grey-2); transition:color .22s var(--ease);
}
.tabbtn svg{ width:20px; height:20px; transition:transform .22s var(--ease); }
.tabbtn span{ font-family:var(--font-mono); font-size:8px; letter-spacing:.14em; text-transform:uppercase; }
.tabbtn.on{ color:var(--white); }
.tabbtn.on svg{ transform:translateY(-1px); }
.tabbtn.ai.on{ color:var(--ai); }
.tabbtn:active svg{ transform:scale(.88); }

/* FAB */
.fab{
  position:absolute; right:18px; bottom:calc(86px + env(safe-area-inset-bottom)); z-index:29;
  height:46px; padding:0 18px; border-radius:100px; background:var(--brand); color:#FFFFFF;
  font-size:13.5px; font-weight:700; display:inline-flex; align-items:center; gap:7px;
  box-shadow:0 14px 30px -10px rgba(158,105,255,.6);
  animation:cardIn .45s var(--ease) both;
}
.fab:active{ transform:scale(.94); }
.fab svg{ width:15px; height:15px; }

/* ---------- sheet ---------- */
.scrim{
  position:fixed; inset:0; z-index:80; background:rgba(4,5,8,.65);
  backdrop-filter:blur(3px); opacity:0; pointer-events:none; transition:opacity .3s var(--ease);
}
.scrim.on{ opacity:1; pointer-events:auto; }
.sheet{
  position:fixed; z-index:90; left:50%; bottom:0; width:400px; max-width:100%;
  transform:translate(-50%,102%);
  background:var(--ink-2); border:1px solid var(--line); border-bottom:0;
  border-radius:28px 28px 0 0; padding:10px var(--pad) calc(24px + env(safe-area-inset-bottom));
  max-height:86vh; overflow-y:auto; scrollbar-width:none;
  transition:transform .42s var(--ease);
}
.sheet::-webkit-scrollbar{ display:none; }
.sheet.on{ transform:translate(-50%,0); }
.grabber{ width:38px; height:4px; border-radius:100px; background:var(--line-2); margin:0 auto 16px; }
.sheet h3{ font-family:var(--font-display); font-weight:400; font-size:22px; margin-bottom:5px; }
.sheet .sub{ color:var(--grey); font-size:13px; margin-bottom:16px; }

/* forms */
.field{ margin-bottom:12px; }
.field label{ display:block; font-family:var(--font-mono); font-size:9px; letter-spacing:.18em; text-transform:uppercase; color:var(--grey-2); margin-bottom:7px; }
.field input,.field textarea,.field select{
  width:100%; background:var(--surface); border:1px solid var(--line);
  border-radius:12px; padding:13px 14px; font-size:14px; outline:none;
}
.field textarea{ resize:none; min-height:74px; }
.field input:focus,.field textarea:focus,.field select:focus{ border-color:var(--brand-line); }
.field-2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.picker{ display:grid; grid-template-columns:1fr 1fr; gap:9px; margin-bottom:6px; }
.pick{
  padding:15px 14px; border-radius:14px; border:1px solid var(--line); background:var(--surface);
  text-align:left; transition:all .2s var(--ease);
}
.pick b{ display:block; font-size:14px; font-weight:600; }
.pick span{ font-size:11.5px; color:var(--grey-2); }
.pick.on{ border-color:var(--brand-line); background:var(--brand-soft); }
.uploader{
  min-height:104px; border-radius:14px; border:1px dashed var(--line-2);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px;
  color:var(--grey-2); margin-bottom:12px; background:var(--surface); padding:16px 14px;
  transition:border-color .2s, background .2s;
}
.uploader:active{ border-color:var(--brand-line); background:var(--surface-2); }
.up-plus{
  width:34px; height:34px; border-radius:50%; display:grid; place-items:center;
  background:var(--brand-soft); border:1px solid var(--brand-line); color:var(--brand);
}
.up-plus svg{ width:16px; height:16px; }
.up-label{ font-size:13px; font-weight:600; color:var(--white); }
.up-hint{ font-size:11.5px; color:var(--grey-2); }
.uploader.has{ border-style:solid; border-color:var(--brand-line); }
.up-thumbs{ display:flex; gap:8px; align-items:center; margin-bottom:4px; }
.up-thumbs img{ width:56px; height:56px; border-radius:11px; object-fit:cover; border:1px solid var(--line-2); }
.up-more{
  width:34px; height:56px; border-radius:11px; display:grid; place-items:center;
  border:1px dashed var(--line-2); color:var(--grey-2);
}
.up-more svg{ width:14px; height:14px; }
.thumb-img{ width:100%; height:100%; object-fit:cover; position:absolute; inset:0; }
.req-photo{ width:100%; height:120px; object-fit:cover; border-radius:12px; margin-bottom:12px; }

/* ---------- toast ---------- */
.toast{
  position:absolute; left:50%; bottom:calc(94px + env(safe-area-inset-bottom)); z-index:70;
  transform:translate(-50%,14px); opacity:0; pointer-events:none;
  padding:11px 18px; border-radius:100px; font-size:13px; font-weight:600;
  background:var(--brand); color:#fff;
  display:flex; align-items:center; gap:8px;
  transition:opacity .3s var(--ease), transform .3s var(--ease);
  box-shadow:0 14px 34px -12px rgba(158,105,255,.7);
}
.toast.on{ opacity:1; transform:translate(-50%,0); }
.toast svg{ width:14px; height:14px; }

/* ---------- misc ---------- */
.empty{ text-align:center; padding:50px var(--pad); color:var(--grey-2); font-size:13px; }
.divider{ height:1px; background:var(--line); margin:22px var(--pad); }
.badge-line{ display:flex; align-items:center; gap:8px; font-size:12px; color:var(--grey); }

.hero-quote{
  margin:22px var(--pad) 0; padding:28px 20px; border-radius:var(--r-lg);
  border:1px solid rgba(255,255,255,.14);
  background:linear-gradient(155deg,#9E69FF 0%, #7B4AE8 100%);
  text-align:center; color:#fff;
}
.hero-quote h4{ font-family:var(--font-brand); font-weight:400; font-size:22px; letter-spacing:.01em; }
.hero-quote p{ font-family:var(--font-mono); font-size:9.5px; letter-spacing:.2em; text-transform:uppercase; color:rgba(255,255,255,.75); margin-top:10px; }

/* ---------- responsive ---------- */
@media (max-width:520px){
  body{ display:block; }
  .ambience{ display:none; }
  .stage{ gap:0; }
  .device{ width:100vw; height:100dvh; border:0; border-radius:0; box-shadow:none; }
  .stage-note{ display:none; }
  .sheet{ width:100%; }
}
@media (max-height:700px) and (min-width:521px){
  .device{ height:94vh; }
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{ animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important; }
}

:focus-visible{ outline:2px solid var(--brand); outline-offset:2px; border-radius:8px; }

/* ---------- added for the demo build: undo, slots, pass, tracking, tour ---------- */
.toast-undo{
  margin-left:6px; padding:4px 10px; border-radius:100px;
  background:rgba(255,255,255,.22); color:#fff; font-size:12px; font-weight:700;
}
.toast-undo:active{ transform:scale(.94); }

/* amenity time slots */
.slots{ display:grid; grid-template-columns:repeat(3,1fr); gap:9px; }
.slot{
  padding:14px 6px; border-radius:14px; border:1px solid var(--line); background:var(--surface);
  font-size:13.5px; font-weight:600; transition:all .2s var(--ease); position:relative;
}
.slot.on{ border-color:var(--brand); background:var(--brand-soft); color:var(--white); }
.slot.taken{ opacity:.4; }
.slot.taken i{ display:block; font-style:normal; font-family:var(--font-mono); font-size:8px; letter-spacing:.14em; text-transform:uppercase; color:var(--grey-2); margin-top:3px; }
.slot:active{ transform:scale(.96); }

/* visitor gate pass */
.pass{
  border-radius:24px; padding:26px 22px; text-align:center;
  background:linear-gradient(160deg,#9E69FF,#6F3FD6);
  border:1px solid rgba(255,255,255,.18); color:#fff;
  box-shadow:0 24px 60px -22px rgba(158,105,255,.75);
}
.pass-eyebrow{ font-family:var(--font-mono); font-size:9px; letter-spacing:.22em; text-transform:uppercase; color:rgba(255,255,255,.75); }
.pass-name{ font-family:var(--font-brand); font-weight:400; font-size:28px; margin-top:10px; }
.pass-sub{ font-size:12.5px; color:rgba(255,255,255,.85); margin-top:5px; }
.pass-qr{ background:#fff; width:186px; height:186px; margin:20px auto 14px; border-radius:16px; display:grid; place-items:center; }
.pass-code{ font-family:var(--font-mono); font-size:22px; letter-spacing:.34em; margin-right:-.34em; }
.pass-meta{
  display:flex; justify-content:space-between; margin-top:18px; padding-top:14px;
  border-top:1px solid rgba(255,255,255,.25);
  font-family:var(--font-mono); font-size:9px; letter-spacing:.14em; text-transform:uppercase; color:rgba(255,255,255,.8);
}

/* maintenance progress */
.track{ display:flex; gap:6px; margin-top:16px; }
.track-step{ flex:1; }
.track-step i{ display:block; height:3px; border-radius:100px; background:rgba(255,255,255,.10); }
.track-step.on i{ background:var(--brand); }
.track-step span{
  display:block; margin-top:7px; font-family:var(--font-mono); font-size:8px;
  letter-spacing:.1em; text-transform:uppercase; color:var(--grey-2);
}
.track-step.on span{ color:var(--white); }

/* guided tour */
.tourbar{
  position:absolute; left:12px; right:12px; bottom:calc(80px + env(safe-area-inset-bottom)); z-index:40;
  padding:16px 18px 14px; border-radius:20px;
  background:rgba(23,16,43,.96); border:1px solid var(--brand-line);
  backdrop-filter:blur(20px); box-shadow:0 20px 50px -18px rgba(0,0,0,.9);
  animation:cardIn .4s var(--ease) both;
}
.tour-step{ font-family:var(--font-mono); font-size:9px; letter-spacing:.2em; text-transform:uppercase; color:var(--brand); }
.tour-text{ font-size:14px; line-height:1.5; margin-top:8px; }
.tour-actions{ display:flex; gap:8px; justify-content:flex-end; margin-top:14px; }
.tour-actions .btn{ height:34px; font-size:12.5px; }

/* ---------- collapsing home header ---------- */
.minibar{
  position:sticky; top:0; z-index:25;
  margin-bottom:-1px;
  padding:calc(env(safe-area-inset-top) + 12px) var(--pad) 12px;
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  background:rgba(14,9,32,.72);
  backdrop-filter:blur(22px) saturate(160%);
  -webkit-backdrop-filter:blur(22px) saturate(160%);
  border-bottom:1px solid transparent;
  opacity:0; transform:translateY(-6px); pointer-events:none;
  transition:opacity .28s var(--ease), transform .28s var(--ease), border-color .28s;
}
.minibar.on{ opacity:1; transform:none; pointer-events:auto; border-bottom-color:var(--line); }
.mini-mark{ text-align:right; line-height:1; }
.mini-mark b{ display:block; font-family:var(--font-brand); font-weight:400; font-size:19px; letter-spacing:.05em; }
.mini-mark span{ display:block; font-family:var(--font-display); font-weight:200; font-size:6.5px; letter-spacing:.44em; margin-right:-.44em; margin-top:3px; color:var(--grey); }

/* the full greeting now scrolls away instead of pinning over the cards */
.topbar.bigbar{
  position:static; background:none;
  padding-top:14px;
  transition:opacity .28s var(--ease), transform .28s var(--ease);
}
.topbar.bigbar.gone{ opacity:0; transform:translateY(-8px); }

/* ---------- creator credit ---------- */
.credit{ margin:22px var(--pad) 0; padding:22px 20px; border-radius:var(--r-lg); border:1px solid var(--line); background:var(--surface); }
.credit-people{ display:flex; flex-direction:column; gap:14px; margin-top:14px; }
.credit-person{ display:flex; align-items:center; gap:12px; }
.credit-person p{ font-size:14.5px; font-weight:600; }
.credit-person span{ font-family:var(--font-mono); font-size:9px; letter-spacing:.16em; text-transform:uppercase; color:var(--grey-2); }
.credit-note{ margin-top:18px; padding-top:14px; border-top:1px solid var(--line); font-family:var(--font-mono); font-size:9px; letter-spacing:.16em; text-transform:uppercase; color:var(--grey-2); }

/* ---------- live occupancy ---------- */
.occ-top{ display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
.occ-word{ display:flex; align-items:center; gap:7px; font-size:12.5px; font-weight:600; }
.occ-count{ font-family:var(--font-mono); font-size:11px; color:var(--grey); }
.occ-bar{ height:6px; border-radius:100px; background:rgba(255,255,255,.08); overflow:hidden; }
.occ-bar i{ display:block; height:100%; border-radius:100px; background:var(--green); transition:width .8s var(--ease); }
.occ.steady .occ-bar i{ background:var(--brand); }
.occ.busy .occ-bar i{ background:#E8A05C; }
.occ.quiet .live-dot{ background:var(--green); }
.occ.steady .live-dot{ background:var(--brand); }
.occ.busy .live-dot{ background:#E8A05C; }

/* busy-times chart */
.busy{ display:flex; align-items:flex-end; gap:4px; height:92px; }
.busy-bar{ flex:1; height:100%; display:flex; align-items:flex-end; }
.busy-bar i{ display:block; width:100%; border-radius:4px 4px 2px 2px; background:rgba(255,255,255,.12); }
.busy-bar.now i{ background:var(--brand); }
.busy-axis{ display:flex; justify-content:space-between; margin-top:8px; font-family:var(--font-mono); font-size:8.5px; letter-spacing:.14em; color:var(--grey-2); }

/* phone-as-key card */
.keycard{
  border-radius:24px; padding:24px 22px; text-align:center; color:#fff;
  background:linear-gradient(160deg,#2A1D4D,#150E2A);
  border:1px solid var(--brand-line);
  box-shadow:0 24px 60px -24px rgba(0,0,0,.9);
}
.key-refresh{
  display:flex; align-items:center; justify-content:center; gap:7px; margin-top:10px;
  font-family:var(--font-mono); font-size:9px; letter-spacing:.18em; text-transform:uppercase; color:var(--grey);
}

/* drone tracking */
.dronebox{ border-radius:22px; border:1px solid var(--line); background:var(--surface); padding:20px; }
.drone-sky{
  position:relative; height:96px; border-radius:16px; overflow:hidden;
  background:linear-gradient(180deg,#2A1D4D,#120B24);
}
.drone-sky .drone{ position:absolute; top:26px; font-size:26px; transition:left 1s var(--ease); }
.drone-sky .pad{
  position:absolute; right:14px; bottom:12px; width:38px; height:8px; border-radius:100px;
  background:var(--brand); box-shadow:0 0 22px 4px rgba(158,105,255,.55);
}
.drone-eta{ text-align:center; margin-top:14px; font-family:var(--font-brand); font-size:22px; }


/* ---------- pinned composer sits between the feed and the tab bar ---------- */
#composerSlot{
  flex:0 0 auto; position:relative; z-index:31;
  /* the tab bar is absolutely positioned over the bottom, so sit clear of it */
  margin-bottom:calc(70px + env(safe-area-inset-bottom));
}
#composerSlot:empty{ display:none; margin-bottom:0; }
.composer input{ min-width:0; }

</style>

  function aiAsk(text) {
    if (!text.trim() || S.aiBusy) return;
    S.aiBusy = true;
    S.aiThread.push({ role: "me", text: text });
    S.aiThread.push({ role: "typing" });
    render();
    scrollThread();
    setTimeout(() => {
      S.aiThread.pop();
      const low = " " + text.toLowerCase().trim() + " ";
      const chat = AI_CHAT.find((x) => x.k.some((w) => low.includes(w)));
      const hit = AI_REPLIES.find((x) => x.k.some((w) => low.includes(w)));
      let out;
      if (chat && !hit) out = { role: "ai", text: chat.t[Math.floor(Math.random() * chat.t.length)] };
      else if (hit) out = { role: "ai", text: typeof hit.t === "function" ? hit.t() : hit.t, card: hit.card };
      else out = { role: "ai", text: "I am not certain about that one. I know this building well though, so try me on your package, the gym, a maintenance issue, booking an amenity, a visitor pass or what is happening tonight." };
      S.aiThread.push(out);
      S.aiBusy = false;
      render();
      scrollThread();
    }, 1150);
  }

  function go(route, params, mode) {
    if (!SCREENS[route]) return;
    if (mode !== "back" && mode !== "tab") S.stack.push({ route: S.route, params: S.params });

    S.route = route;
    S.params = params || {};
    render();
    view.scrollTop = 0;
    if (route === "ai" && S.aiThread.length) scrollThread();

    const prev = S.stack.pop();

      case "tabnav": {
        closeSheet();
        go(t.dataset.route, {}, "tab");
        break;
      }
      case "go": {
        closeSheet();
        go(t.dataset.route, { id: t.dataset.id }, "push");
        break;
      }
      case "back": back(); break;

      case "comtab": {
        S.comTab = t.dataset.tab;
        S.route = "community";
        render();
        view.scrollTop = 0;
        break;
      }
      case "filter": {
        S.filter = t.dataset.key;
        render();
        break;
      }
      case "mcat": { S.mcat = t.dataset.key; render(); break; }
      case "myint": {
        const k = t.dataset.key;
        if (S.myInterests.has(k)) S.myInterests.delete(k); else S.myInterests.add(k);
        t.classList.toggle("on", S.myInterests.has(k));
        break;
      }
      case "amenpick": { S.amenityPick = t.dataset.id; S.amenitySlot = null; render(); break; }
      case "amenday":  { S.amenityDay = t.dataset.key; S.amenitySlot = null; render(); break; }
      case "amenslot": { S.amenitySlot = t.dataset.key; render(); break; }
      case "bookamenity": {
        const am = AMENITIES.find((x) => x.id === S.amenityPick);
        const b = { id: uid("b"), name: am.name, day: S.amenityDay, slot: S.amenitySlot };
        S.bookings.unshift(b);
        S.amenitySlot = null;
        go("requests", {}, "push");
        toast("Booked · " + b.name + " " + b.day, () => { S.bookings = S.bookings.filter((x) => x.id !== b.id); render(); });
        break;
      }
      case "cancelbooking": {
        const id = t.dataset.id;
        const b = S.bookings.find((x) => x.id === id);
        confirmThen("Cancel this booking?", b ? b.name + " · " + b.day + " " + b.slot : "", "Cancel booking", () => {
          S.bookings = S.bookings.filter((x) => x.id !== id); render();
          toast("Booking cancelled", () => { S.bookings.unshift(b); render(); });
        });
        break;
      }
      case "cancelreq": {
        const id = t.dataset.id;
        const q = S.requests.find((x) => x.id === id);
        confirmThen("Cancel this request?", "The technician will be told it is no longer needed.", "Cancel request", () => {
          S.requests = S.requests.filter((x) => x.id !== id); render();
          toast("Request cancelled", () => { S.requests.unshift(q); render(); });
        });
        break;
      }
      case "cancelpass": {
        const id = t.dataset.id;
        const p = S.passes.find((x) => x.id === id);
        confirmThen("Revoke this pass?", p ? "The gate code for " + p.name + " stops working immediately." : "", "Revoke pass", () => {
          S.passes = S.passes.filter((x) => x.id !== id);
          back();
          toast("Pass revoked", () => { S.passes.unshift(p); render(); });
        });
        break;
      }
      case "pickphoto": {
        const inp = document.getElementById(t.dataset.for);
        if (inp) inp.click();
        break;
      }
      case "makepass": makePass(); break;
      case "unlock": {
        const b = t;
        b.classList.add("is-done");
        b.innerHTML = ic("check") + "Door open · welcome in";
        LIVE.gym.now = Math.min(LIVE.gym.cap, LIVE.gym.now + 1);
        toast("Gym unlocked · you are checked in", () => { LIVE.gym.now = Math.max(0, LIVE.gym.now - 1); render(); });
        break;
      }
      case "dronenext": {
        S.droneStage = Math.min(3, (S.droneStage || 0) + 1);
        render();
        if (S.droneStage === 3) toast("Drone landed · locker 12");
        break;
      }
      case "concierge": {
        confirmThen("Request " + t.dataset.name + "?", "The concierge team confirms availability and comes back to you in the app, usually within the hour.",
          "Send request", () => { toast("Request sent to concierge"); });
        break;
      }
      case "tourstart": tourGo(0); break;
      case "tournext": tourGo(S.tour.step + 1); break;
      case "tourend": { S.tour.on = false; render(); break; }
      case "reset": {
        confirmThen("Reset the demo?", "Everything you joined, saved, listed or booked goes back to the opening state. Useful between presentations.", "Reset demo", resetDemo);
        break;
      }
      case "dosearch": {
        const el = document.getElementById("qInput");
        S.query = el ? el.value : "";
        render();
        const again = document.getElementById("qInput");
        if (again) { again.focus(); again.setSelectionRange(again.value.length, again.value.length); }
        break;
      }
      case "pick": {
        t.parentElement.querySelectorAll(".pick").forEach((x) => x.classList.remove("on"));
        t.classList.add("on");
        break;
      }
      case "join": {
        const id = t.dataset.id;
        if (S.joined.has(id)) { S.joined.delete(id); render(); toast("Left activity", () => { S.joined.add(id); render(); }); }
        else {
          S.joined.add(id); render();
          const m = MATCHES.find((x) => x.id === id);
          toast(m ? "Joined · " + m.title : "Joined", () => { S.joined.delete(id); render(); });
        }
        break;
      }
      case "cancelspot": {
        const id = t.dataset.id;
        const m = MATCHES.find((x) => x.id === id);
        confirmThen("Cancel your spot?", m ? m.title + " · " + m.when + ". The other residents are told a place opened up." : "",
          "Cancel my spot", () => {
            S.joined.delete(id); render();
            toast("Spot cancelled", () => { S.joined.add(id); render(); });
          });
        break;
      }
      case "confirmyes": {
        const c = S.confirmData;
        closeSheet();
        if (c && typeof c.run === "function") c.run();
        break;
      }
      case "closesheet": closeSheet(); break;
      case "undo": {
        const u = S.undo;
        S.undo = null;
        hideToast();
        if (u && typeof u.run === "function") u.run();
        break;
      }
      case "joingroup": {
        const id = t.dataset.id;
        if (S.groups.has(id)) { S.groups.delete(id); toast("Left group"); }
        else { S.groups.add(id); toast("Joined group"); }
        render();
        break;
      }
      case "save": {
        const id = t.dataset.id;
        if (S.saved.has(id)) { S.saved.delete(id); toast("Removed from saved"); }
        else { S.saved.add(id); toast("Saved"); }
        render();
        break;
      }
      case "helpful": {
        const id = t.dataset.id;
        if (!S.helpful.has(id)) { S.helpful.add(id); toast("Marked helpful"); render(); }
        break;
      }
      case "connect": {
        S.connected.add(t.dataset.id);
        toast("Request sent · they choose to accept");
        render();
        break;
      }
      case "tog": {
        const k = t.dataset.key;
        S.prefs[k] = !S.prefs[k];
        const knob = t.querySelector(".tog");
        if (knob) knob.classList.toggle("on", S.prefs[k]);
        break;
      }
      case "sheet": openSheet(t.dataset.sheet); break;
      case "publish": {
        const kind = t.dataset.kind;
        closeSheet();
        if (kind === "listing") createListing();
        else if (kind === "activity") createActivity();
        else if (kind === "ask") createQuestion();
        else if (kind === "maintenance") createRequest();
        else if (kind === "interests") { render(); toast("Interests updated"); }
        else toast(t.dataset.msg || "Published");
        break;
      }
      case "toastonly": toast(t.dataset.msg || "Done"); break;
      case "refresh": {
        render();
        toast("Feed updated");
        break;
      }
      case "aisay": {
        aiAsk(t.dataset.text);
        break;
      }
      case "aisend": {
        const inp = document.getElementById("aiInput");
        if (inp && inp.value.trim()) { const v = inp.value; inp.value = ""; aiAsk(v); }
        break;
      }
      case "chatsend": {
        const who = t.dataset.id;
        const inp = document.getElementById("chatInput");
        if (!inp || !inp.value.trim()) break;
        S.chat[who].push({ me: true, t: inp.value });
        inp.value = "";
        render();
        scrollThread();
        setTimeout(() => {
          S.chat[who].push({ me: false, t: "Perfect. I am around this evening, I will meet you in the lobby." });
          if (S.route === "chat") { render(); scrollThread(); }
        }, 1400);
        break;
      }
    }
  });

  /* photos chosen from the camera roll show up as real thumbnails */
  document.addEventListener("change", function (e) {
    const inp = e.target;
    if (!inp || inp.type !== "file" || !inp.files || !inp.files.length) return;
    const drop = document.getElementById(inp.id === "lPhoto" ? "lDrop" : "mDrop");
    const files = Array.prototype.slice.call(inp.files, 0, 4);
    let loaded = 0;
    S.photos = [];
    files.forEach(function (f, i) {
      const rd = new FileReader();
      rd.onload = function () {
        S.photos[i] = rd.result;
        if (++loaded === files.length && drop) {
          drop.classList.add("has");
          drop.innerHTML = '<div class="up-thumbs">' +
            S.photos.map(function (src) { return '<img src="' + src + '" alt="" />'; }).join("") +
            '<span class="up-more">' + ic("plus") + "</span></div>" +
            '<span class="up-label">' + S.photos.length + (S.photos.length === 1 ? " photo added" : " photos added") + "</span>";
          toast(S.photos.length === 1 ? "Photo added" : S.photos.length + " photos added");
        }
      };
      rd.readAsDataURL(f);
    });
  });

  document.addEventListener("input", function (e) {
    if (e.target && e.target.id === "qInput") {
      S.query = e.target.value;
      const scroll = view.scrollTop;
      render();
      const el = document.getElementById("qInput");
      if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
      view.scrollTop = scroll;
    }
  });

  document.addEventListener("keydown", function (e) {
    if (e.key !== "Enter") return;
    if (e.target.id === "aiInput") { const v = e.target.value; e.target.value = ""; aiAsk(v); }
    if (e.target.id === "chatInput") { document.querySelector('[data-act="chatsend"]').click(); }
  });

  /* collapse the greeting into the slim bar as the feed scrolls */
  view.addEventListener("scroll", function () {
    const mini = document.getElementById("minibar");
    const big = document.getElementById("bigbar");
    if (!mini || !big) return;
    const past = view.scrollTop > 46;
    mini.classList.toggle("on", past);
    big.classList.toggle("gone", past);
  }, { passive: true });

  /* occupancy drifts gently, so the numbers are visibly live during a demo */
  setInterval(function () {
    Object.keys(LIVE).forEach(function (k) {
      const l = LIVE[k];
      if (Math.random() < 0.55) return;
      l.now = Math.max(0, Math.min(l.cap, l.now + (Math.random() < 0.5 ? -1 : 1)));
    });
    if (S.route === "amenities" || S.route === "facilities" || S.route === "facility") {
      const y = view.scrollTop; render(); view.scrollTop = y;
    }
  }, 5000);

  scrim.addEventListener("click", closeSheet);

  /* ---------------- boot ---------------- */
  render();
  const splash = document.getElementById("splash");
  function dismiss() {
    splash.classList.add("out");
    setTimeout(() => splash.remove(), 800);
  }
  setTimeout(dismiss, 3000);
  splash.addEventListener("click", dismiss);
})();

</script>
</body>
</html>
